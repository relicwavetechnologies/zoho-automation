name: divo-development

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  divo-dev-postgres:
    image: postgres:16-alpine
    env_file:
      - ${DIVO_DEV_ENV_FILE:-/dev/null}
    environment:
      POSTGRES_DB: ${DIVO_DEV_POSTGRES_DB:-divo_dev}
      POSTGRES_USER: ${DIVO_DEV_POSTGRES_USER:-divo_dev_app}
      POSTGRES_PASSWORD: ${DIVO_DEV_POSTGRES_PASSWORD:?DIVO_DEV_POSTGRES_PASSWORD is required}
    volumes:
      - divo_dev_postgres_data:/var/lib/postgresql/data
    ports:
      # SSH forwards to this VPS-loopback port. Never bind dev Postgres to a
      # public interface; local development reaches it through the VPS SSH
      # boundary only.
      - "127.0.0.1:${DIVO_DEV_POSTGRES_PORT:-15433}:5432"
    restart: unless-stopped
    networks:
      - divo-dev-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  divo-dev-backend:
    image: ${DIVO_DEV_BACKEND_IMAGE:?DIVO_DEV_BACKEND_IMAGE is required}
    env_file:
      - ${DIVO_DEV_ENV_FILE:-/dev/null}
    environment:
      # This stack intentionally permits local test credentials and HITL test
      # switches. The production compose file enforces strict startup secrets.
      NODE_ENV: development
      PORT: 3001
      APP_BASE_URL: ${DIVO_DEV_PUBLIC_URL:?DIVO_DEV_PUBLIC_URL is required}
      BACKEND_PUBLIC_URL: ${DIVO_DEV_PUBLIC_URL:?DIVO_DEV_PUBLIC_URL is required}
      LARK_CARD_CALLBACK_URL: "${DIVO_DEV_PUBLIC_URL:?DIVO_DEV_PUBLIC_URL is required}/webhooks/lark/events"
      REDIS_URL: redis://divo-dev-redis-cache:6379/0
      REDIS_QUEUE_URL: redis://divo-dev-redis-queue:6379/0
      REDIS_CACHE_URL: redis://divo-dev-redis-cache:6379/0
      REDIS_MEMORY_URL: redis://divo-dev-redis-memory:6379/0
      GOOGLE_WORKSPACE_MCP_URL: http://google-workspace-mcp:8000/mcp
      PI_LARK_CONTROLLER_URL: http://divo-dev-pi-controller:4317
      PI_LARK_RUNTIME_INSTANCE_ID: ${PI_LARK_RUNTIME_INSTANCE_ID:-pi-development-1}
      HINDSIGHT_ENABLED: "true"
      HINDSIGHT_URL: http://divo-dev-hindsight:8888
      HINDSIGHT_API_KEY: ${DIVO_DEV_HINDSIGHT_API_KEY:-divo-dev-memory-key}
      KNOWLEDGE_FILE_MALWARE_SCAN_MODE: required
      CLAMAV_HOST: divo-dev-clamav
      CLAMAV_PORT: 3310
    depends_on:
      divo-dev-postgres:
        condition: service_healthy
      divo-dev-redis-queue:
        condition: service_healthy
      divo-dev-redis-cache:
        condition: service_healthy
      divo-dev-redis-memory:
        condition: service_healthy
      google-workspace-mcp:
        condition: service_healthy
      divo-dev-pi-controller:
        condition: service_healthy
      divo-dev-hindsight:
        condition: service_healthy
      divo-dev-clamav:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DIVO_DEV_BACKEND_PORT:-13001}:3001"
    restart: unless-stopped
    networks:
      - divo-dev-internal
      - divo-dev-agent-control
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5

  divo-dev-hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.8.6
    env_file:
      - ${DIVO_DEV_ENV_FILE:-/dev/null}
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:${DIVO_DEV_HINDSIGHT_DB_PASSWORD:-divo-dev-hindsight}@divo-dev-hindsight-postgres:5432/hindsight
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_LLM_PROVIDER:-openai}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:-gpt-4o-mini}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_LLM_API_KEY:?HINDSIGHT_LLM_API_KEY is required}
      HINDSIGHT_API_RERANKER_PROVIDER: rrf
      HINDSIGHT_API_WORKER_ID: divo-development-1
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${DIVO_DEV_HINDSIGHT_API_KEY:-divo-dev-memory-key}
      HINDSIGHT_API_ENABLE_BANK_CONFIG_API: "false"
      HINDSIGHT_API_DEFAULT_BANK_TEMPLATE: '{"version":"1","bank":{"retain_strategies":{"exact":{"retain_extraction_mode":"verbatim","enable_observations":false}}}}'
    depends_on:
      divo-dev-hindsight-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - divo-dev-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 8

  divo-dev-clamav:
    image: clamav/clamav:1.5.3
    volumes:
      - divo_dev_clamav_signatures:/var/lib/clamav
    restart: unless-stopped
    networks:
      - divo-dev-internal

  divo-dev-hindsight-postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: hindsight
      POSTGRES_USER: hindsight
      POSTGRES_PASSWORD: ${DIVO_DEV_HINDSIGHT_DB_PASSWORD:-divo-dev-hindsight}
    volumes:
      - divo_dev_hindsight_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - divo-dev-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hindsight -d hindsight"]
      interval: 10s
      timeout: 5s
      retries: 8

  divo-dev-pi-controller:
    image: ${DIVO_DEV_PI_CONTROLLER_IMAGE:?DIVO_DEV_PI_CONTROLLER_IMAGE is required}
    user: "0:0"
    environment:
      DIVO_CONTROLLER_HOST: 0.0.0.0
      DIVO_CONTROLLER_PORT: 4317
      DIVO_PI_IMAGE: ${DIVO_DEV_PI_IMAGE:?DIVO_DEV_PI_IMAGE is required}
      DIVO_PI_RESOURCE_PREFIX: divo-pi-dev
      DIVO_PI_ADD_HOST_GATEWAY: "false"
      HOME: /tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - divo-dev-agent-control
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4317/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  google-workspace-mcp:
    image: ghcr.io/taylorwilsdon/google_workspace_mcp:1.22.0
    env_file:
      - ${DIVO_DEV_ENV_FILE:-/dev/null}
    environment:
      MCP_ENABLE_OAUTH21: "true"
      EXTERNAL_OAUTH21_PROVIDER: "true"
      WORKSPACE_MCP_STATELESS_MODE: "true"
      WORKSPACE_MCP_TOOL_TIER: complete
      WORKSPACE_MCP_TOOLS: gmail,drive,calendar,docs,sheets,slides,forms,tasks,contacts,chat,appscript
      TOOL_TIER: complete
      TOOLS: gmail drive calendar docs sheets slides forms tasks contacts chat appscript
      ALLOWED_FILE_DIRS: /tmp/divo-no-local-files
    restart: unless-stopped
    networks:
      - divo-dev-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  divo-dev-admin:
    image: ${DIVO_DEV_ADMIN_IMAGE:?DIVO_DEV_ADMIN_IMAGE is required}
    depends_on:
      divo-dev-backend:
        condition: service_started
    ports:
      - "127.0.0.1:${DIVO_DEV_ADMIN_PORT:-18081}:80"
    restart: unless-stopped
    networks:
      - divo-dev-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  divo-dev-redis-queue:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - divo_dev_redis_queue_data:/data
    restart: unless-stopped
    networks:
      - divo-dev-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  divo-dev-redis-cache:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "300", "10"]
    volumes:
      - divo_dev_redis_cache_data:/data
    restart: unless-stopped
    networks:
      - divo-dev-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  divo-dev-redis-memory:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "300", "10"]
    volumes:
      - divo_dev_redis_memory_data:/data
    restart: unless-stopped
    networks:
      - divo-dev-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  divo-dev-internal:
    driver: bridge
  divo-dev-agent-control:
    driver: bridge

volumes:
  divo_dev_postgres_data:
  divo_dev_redis_queue_data:
  divo_dev_redis_cache_data:
  divo_dev_redis_memory_data:
  divo_dev_hindsight_postgres_data:
  divo_dev_clamav_signatures:
