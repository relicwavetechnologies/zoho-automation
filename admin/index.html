<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The desktop app's own icon source, copied from jan/brand/divo. The
         page had no favicon at all, so every Divo tab wore the browser's blank
         sheet next to whatever else was open. -->
    <link rel="icon" type="image/svg+xml" href="/divo-mark.svg" />
    <title>Divo Ops Console</title>
    <meta name="description" content="Review Divo runs, costs, approvals, and execution traces across Lark and desktop." />
    <meta property="og:title" content="Divo Ops Console" />
    <meta property="og:description" content="Review Divo runs, costs, approvals, and execution traces across Lark and desktop." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Divo Ops Console" />
    <meta name="twitter:description" content="Review Divo runs, costs, approvals, and execution traces across Lark and desktop." />
    <script src="/runtime-config.js"></script>
    <script>
      // Apply theme synchronously to avoid flash. Mirrors useTheme() default.
      (function () {
        try {
          var stored = localStorage.getItem("divo_admin_theme");
          var theme = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = theme === "dark" || (theme === "system" && prefersDark);
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
