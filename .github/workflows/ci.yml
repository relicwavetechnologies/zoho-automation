name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      deploy_development:
        description: Deploy the current dev commit after CI passes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.33.4
  NODE_VERSION: 22

jobs:
  main-pr-source:
    name: main-pr-source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: test "${HEAD_REF}" = dev

  advance-backend:
    name: advance-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: advance-backend
    env:
      NODE_ENV: test
      PORT: 3001
      APP_BASE_URL: http://127.0.0.1:8081
      BACKEND_PUBLIC_URL: http://127.0.0.1:3001
      DATABASE_URL: postgresql://user:password@localhost:5432/divo
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_QUEUE_URL: redis://127.0.0.1:6379/1
      REDIS_CACHE_URL: redis://127.0.0.1:6379/2
      REDIS_MEMORY_URL: redis://127.0.0.1:6379/3
      OPENAI_API_KEY: test-openai-key
      GOOGLE_GENERATIVE_AI_API_KEY: test-google-key
      GEMINI_API_KEY: test-google-key
      GROQ_API_KEY: test-groq-key
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_API_KEY: test-qdrant-key
      ADMIN_JWT_SECRET: test-admin-jwt-secret
      MEMBER_JWT_SECRET: test-member-jwt-secret
      CLOUDINARY_CLOUD_NAME: test-cloud
      CLOUDINARY_API_KEY: test-cloudinary-key
      CLOUDINARY_API_SECRET: test-cloudinary-secret
      ZOHO_TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      DATA_EXPORT_UNISOLATED_TEST_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: advance-backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # Live integration suites auto-skip when service credentials are absent.
        # Do not provide placeholder Lark/Google/Zoho credentials here; they make
        # the suites attempt real API calls with invalid tokens.
        run: pnpm test

  admin:
    name: admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      VITE_API_BASE_URL: http://127.0.0.1:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  divo-pi:
    name: divo-pi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: divo-pi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: divo-pi/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test Divo runtime and controller
        run: npm run divo:test

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs:
      - advance-backend
      - admin
      - divo-pi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.deploy_development == true) }}
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.deploy_development == true) }}
        uses: docker/build-push-action@v7
        with:
          context: ./advance-backend
          load: true
          tags: divo-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build admin image
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.deploy_development == true) }}
        uses: docker/build-push-action@v7
        with:
          context: ./admin
          load: true
          tags: divo-admin:ci
          build-args: VITE_API_BASE_URL=http://127.0.0.1:3001
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

      - name: Build Pi runtime image
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.deploy_development == true) }}
        uses: docker/build-push-action@v7
        with:
          context: ./divo-pi
          load: true
          tags: divo-pi:ci
          cache-from: type=gha,scope=pi
          cache-to: type=gha,mode=max,scope=pi

      - name: Build Pi controller image
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.deploy_development == true) }}
        uses: docker/build-push-action@v7
        with:
          context: ./divo-pi
          file: ./divo-pi/Dockerfile.controller
          load: true
          tags: divo-pi-controller:ci
          cache-from: type=gha,scope=pi-controller
          cache-to: type=gha,mode=max,scope=pi-controller

      - name: Validate Pi controller image
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.deploy_development == true) }}
        run: >-
          docker run --rm --entrypoint node divo-pi-controller:ci
          --input-type=module --eval "await import('./divo/local-rpc-server.mjs')"

      - name: Validate Compose config
        run: DIVO_ENV_FILE=/dev/null docker compose --env-file .env.production.example config >/dev/null

      - name: Validate development Compose config
        run: |
          DIVO_DEV_ENV_FILE=/dev/null \
          DIVO_DEV_BACKEND_IMAGE=divo-backend:ci \
          DIVO_DEV_ADMIN_IMAGE=divo-admin:ci \
          DIVO_DEV_PI_IMAGE=divo-pi:ci \
          DIVO_DEV_PI_CONTROLLER_IMAGE=divo-pi-controller:ci \
          DIVO_DEV_POSTGRES_PASSWORD=ci-placeholder \
          DIVO_DEV_PUBLIC_URL=https://app-dev.103.172.92.187.sslip.io \
          HINDSIGHT_LLM_API_KEY=ci-placeholder \
          docker compose -f docker-compose.dev.yml config >/dev/null

  publish-development-images:
    name: publish-development-images
    runs-on: ubuntu-latest
    needs:
      - docker-build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.deploy_development == true
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./advance-backend
            file: ./advance-backend/Dockerfile
            build-args: ""
          - component: admin
            context: ./admin
            file: ./admin/Dockerfile
            build-args: VITE_API_BASE_URL=
          - component: pi
            context: ./divo-pi
            file: ./divo-pi/Dockerfile
            build-args: ""
          - component: pi-controller
            context: ./divo-pi
            file: ./divo-pi/Dockerfile.controller
            build-args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component }} image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/relicwavetechnologies/zoho-automation/${{ matrix.component }}:dev-${{ github.sha }}
            ghcr.io/relicwavetechnologies/zoho-automation/${{ matrix.component }}:dev-latest
          labels: com.divo.environment=development
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Record ${{ matrix.component }} release image
        run: |
          {
            echo "### Development image: ${{ matrix.component }}"
            echo "- Tag: \`dev-${GITHUB_SHA}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Build cache and timing details are attached in the Docker build summary."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-development:
    name: deploy-development
    runs-on: ubuntu-latest
    needs:
      - publish-development-images
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.deploy_development == true
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: /opt/divo-dev
      DIVO_DEV_DOMAIN: app-dev.103.172.92.187.sslip.io
      DIVO_DEV_HOST: 103.172.92.187
      DIVO_DEV_USER: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start deployment timer
        run: echo "DEPLOY_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Validate deployment secrets
        env:
          DIVO_DEV_SSH_KEY: ${{ secrets.DIVO_DEV_SSH_KEY }}
        run: |
          test -n "${DIVO_DEV_SSH_KEY}"

      - name: Configure SSH
        env:
          DIVO_DEV_SSH_KEY: ${{ secrets.DIVO_DEV_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DIVO_DEV_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '103.172.92.187 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICer9x9ARy2oBqzIGOALmDDLZPwpIfEmbXuutFu53Nuy' >> ~/.ssh/known_hosts

      - name: Verify development environment is provisioned
        run: |
          ssh -i ~/.ssh/id_ed25519 "${DIVO_DEV_USER}@${DIVO_DEV_HOST}" \
            "test -r '${DEPLOY_DIR}/.env.development.local' && command -v docker >/dev/null && docker compose version >/dev/null"

      - name: Authorize development tunnel keys
        run: |
          scp -i ~/.ssh/id_ed25519 \
            infra/development/developer-authorized-keys \
            "${DIVO_DEV_USER}@${DIVO_DEV_HOST}:/tmp/divo-development-authorized-keys"
          ssh -i ~/.ssh/id_ed25519 "${DIVO_DEV_USER}@${DIVO_DEV_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          install -m 700 -d ~/.ssh
          touch ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          while IFS= read -r key; do
            [[ -z "${key}" ]] && continue
            grep -qxF "${key}" ~/.ssh/authorized_keys || printf '%s\n' "${key}" >> ~/.ssh/authorized_keys
          done < /tmp/divo-development-authorized-keys
          rm -f /tmp/divo-development-authorized-keys
          REMOTE

      - name: Upload development configuration
        run: |
          ssh -i ~/.ssh/id_ed25519 "${DIVO_DEV_USER}@${DIVO_DEV_HOST}" \
            "install -d -m 700 '${DEPLOY_DIR}'"
          scp -i ~/.ssh/id_ed25519 \
            docker-compose.dev.yml \
            "${DIVO_DEV_USER}@${DIVO_DEV_HOST}:${DEPLOY_DIR}/docker-compose.yml"

      - name: Pull images, migrate, and restart
        env:
          BACKEND_IMAGE: ghcr.io/relicwavetechnologies/zoho-automation/backend:dev-${{ github.sha }}
          ADMIN_IMAGE: ghcr.io/relicwavetechnologies/zoho-automation/admin:dev-${{ github.sha }}
          PI_IMAGE: ghcr.io/relicwavetechnologies/zoho-automation/pi:dev-${{ github.sha }}
          PI_CONTROLLER_IMAGE: ghcr.io/relicwavetechnologies/zoho-automation/pi-controller:dev-${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | ssh -i ~/.ssh/id_ed25519 "${DIVO_DEV_USER}@${DIVO_DEV_HOST}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

          ssh -i ~/.ssh/id_ed25519 "${DIVO_DEV_USER}@${DIVO_DEV_HOST}" \
            "cd '${DEPLOY_DIR}' && \
             DIVO_DEV_ENV_FILE=.env.development.local \
             DIVO_DEV_BACKEND_IMAGE='${BACKEND_IMAGE}' \
             DIVO_DEV_ADMIN_IMAGE='${ADMIN_IMAGE}' \
             DIVO_DEV_PI_IMAGE='${PI_IMAGE}' \
             DIVO_DEV_PI_CONTROLLER_IMAGE='${PI_CONTROLLER_IMAGE}' \
             docker compose --env-file .env.development.local pull && \
             docker pull '${PI_IMAGE}' && \
             DIVO_DEV_ENV_FILE=.env.development.local \
             DIVO_DEV_BACKEND_IMAGE='${BACKEND_IMAGE}' \
             DIVO_DEV_ADMIN_IMAGE='${ADMIN_IMAGE}' \
             DIVO_DEV_PI_IMAGE='${PI_IMAGE}' \
             DIVO_DEV_PI_CONTROLLER_IMAGE='${PI_CONTROLLER_IMAGE}' \
             docker compose --env-file .env.development.local up -d --wait divo-dev-postgres divo-dev-redis-queue divo-dev-redis-cache divo-dev-redis-memory && \
             DIVO_DEV_ENV_FILE=.env.development.local \
             DIVO_DEV_BACKEND_IMAGE='${BACKEND_IMAGE}' \
             DIVO_DEV_ADMIN_IMAGE='${ADMIN_IMAGE}' \
             DIVO_DEV_PI_IMAGE='${PI_IMAGE}' \
             DIVO_DEV_PI_CONTROLLER_IMAGE='${PI_CONTROLLER_IMAGE}' \
             docker compose --env-file .env.development.local run --rm --no-deps divo-dev-backend pnpm prisma db execute --file prisma/migrations/20260731_drop_scheduled_workflow_origin_chat/migration.sql --schema prisma/schema.prisma && \
             DIVO_DEV_ENV_FILE=.env.development.local \
             DIVO_DEV_BACKEND_IMAGE='${BACKEND_IMAGE}' \
             DIVO_DEV_ADMIN_IMAGE='${ADMIN_IMAGE}' \
             DIVO_DEV_PI_IMAGE='${PI_IMAGE}' \
             DIVO_DEV_PI_CONTROLLER_IMAGE='${PI_CONTROLLER_IMAGE}' \
             docker compose --env-file .env.development.local run --rm --no-deps divo-dev-backend pnpm prisma db push --skip-generate && \
             DIVO_DEV_ENV_FILE=.env.development.local \
             DIVO_DEV_BACKEND_IMAGE='${BACKEND_IMAGE}' \
             DIVO_DEV_ADMIN_IMAGE='${ADMIN_IMAGE}' \
             DIVO_DEV_PI_IMAGE='${PI_IMAGE}' \
             DIVO_DEV_PI_CONTROLLER_IMAGE='${PI_CONTROLLER_IMAGE}' \
             docker compose --env-file .env.development.local run --rm --no-deps divo-dev-backend pnpm tsx scripts/seed-registered-tools.ts && \
             DIVO_DEV_ENV_FILE=.env.development.local \
             DIVO_DEV_BACKEND_IMAGE='${BACKEND_IMAGE}' \
             DIVO_DEV_ADMIN_IMAGE='${ADMIN_IMAGE}' \
             DIVO_DEV_PI_IMAGE='${PI_IMAGE}' \
             DIVO_DEV_PI_CONTROLLER_IMAGE='${PI_CONTROLLER_IMAGE}' \
             docker compose --env-file .env.development.local run --rm --no-deps divo-dev-backend pnpm provision:google-workspace-skills && \
             DIVO_DEV_ENV_FILE=.env.development.local \
             DIVO_DEV_BACKEND_IMAGE='${BACKEND_IMAGE}' \
             DIVO_DEV_ADMIN_IMAGE='${ADMIN_IMAGE}' \
             DIVO_DEV_PI_IMAGE='${PI_IMAGE}' \
             DIVO_DEV_PI_CONTROLLER_IMAGE='${PI_CONTROLLER_IMAGE}' \
             docker compose --env-file .env.development.local up -d --no-build --remove-orphans"

      - name: Smoke test the local stack and HTTPS route
        env:
          BACKEND_IMAGE: ghcr.io/relicwavetechnologies/zoho-automation/backend:dev-${{ github.sha }}
          ADMIN_IMAGE: ghcr.io/relicwavetechnologies/zoho-automation/admin:dev-${{ github.sha }}
          PI_IMAGE: ghcr.io/relicwavetechnologies/zoho-automation/pi:dev-${{ github.sha }}
          PI_CONTROLLER_IMAGE: ghcr.io/relicwavetechnologies/zoho-automation/pi-controller:dev-${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${DIVO_DEV_USER}@${DIVO_DEV_HOST}" \
            "DIVO_DEV_DOMAIN='${DIVO_DEV_DOMAIN}' DEPLOY_DIR='${DEPLOY_DIR}' DIVO_DEV_BACKEND_IMAGE='${BACKEND_IMAGE}' DIVO_DEV_ADMIN_IMAGE='${ADMIN_IMAGE}' DIVO_DEV_PI_IMAGE='${PI_IMAGE}' DIVO_DEV_PI_CONTROLLER_IMAGE='${PI_CONTROLLER_IMAGE}' bash -s" <<'REMOTE'
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 http://127.0.0.1:13001/health >/dev/null \
              && curl -fsS --max-time 10 http://127.0.0.1:18081/ >/dev/null \
              && curl -fsS --max-time 15 --resolve "${DIVO_DEV_DOMAIN}:443:127.0.0.1" "https://${DIVO_DEV_DOMAIN}/" >/dev/null \
              && cd "${DEPLOY_DIR}" \
              && DIVO_DEV_BACKEND_IMAGE="${DIVO_DEV_BACKEND_IMAGE}" \
                 DIVO_DEV_ADMIN_IMAGE="${DIVO_DEV_ADMIN_IMAGE}" \
                 DIVO_DEV_PI_IMAGE="${DIVO_DEV_PI_IMAGE}" \
                 DIVO_DEV_PI_CONTROLLER_IMAGE="${DIVO_DEV_PI_CONTROLLER_IMAGE}" \
                 docker compose --env-file .env.development.local exec -T divo-dev-backend \
                 node -e "fetch('http://divo-dev-pi-controller:4317/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              cd "${DEPLOY_DIR}"
              DIVO_DEV_BACKEND_IMAGE="${DIVO_DEV_BACKEND_IMAGE}" \
              DIVO_DEV_ADMIN_IMAGE="${DIVO_DEV_ADMIN_IMAGE}" \
              DIVO_DEV_PI_IMAGE="${DIVO_DEV_PI_IMAGE}" \
              DIVO_DEV_PI_CONTROLLER_IMAGE="${DIVO_DEV_PI_CONTROLLER_IMAGE}" \
                docker compose --env-file .env.development.local ps
              exit 0
            fi

            sleep 5
          done

          cd "${DEPLOY_DIR}"
          DIVO_DEV_BACKEND_IMAGE="${DIVO_DEV_BACKEND_IMAGE}" \
          DIVO_DEV_ADMIN_IMAGE="${DIVO_DEV_ADMIN_IMAGE}" \
          DIVO_DEV_PI_IMAGE="${DIVO_DEV_PI_IMAGE}" \
          DIVO_DEV_PI_CONTROLLER_IMAGE="${DIVO_DEV_PI_CONTROLLER_IMAGE}" \
            docker compose --env-file .env.development.local ps
          DIVO_DEV_BACKEND_IMAGE="${DIVO_DEV_BACKEND_IMAGE}" \
          DIVO_DEV_ADMIN_IMAGE="${DIVO_DEV_ADMIN_IMAGE}" \
          DIVO_DEV_PI_IMAGE="${DIVO_DEV_PI_IMAGE}" \
          DIVO_DEV_PI_CONTROLLER_IMAGE="${DIVO_DEV_PI_CONTROLLER_IMAGE}" \
            docker compose --env-file .env.development.local logs --tail=160 divo-dev-backend divo-dev-admin google-workspace-mcp divo-dev-pi-controller
          exit 1
          REMOTE

      - name: Record deployment duration
        if: ${{ always() }}
        run: |
          elapsed=$(( $(date +%s) - DEPLOY_STARTED_AT ))
          {
            echo "### Development deployment"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Duration: $((elapsed / 60))m $((elapsed % 60))s"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
