name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      deploy_development:
        description: Deploy the current dev commit after CI passes
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.33.4
  NODE_VERSION: 22

jobs:
  main-pr-source:
    name: main-pr-source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: test "${HEAD_REF}" = dev

  advance-backend:
    name: advance-backend
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.deploy_development == true) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: advance-backend
    env:
      NODE_ENV: test
      PORT: 3001
      APP_BASE_URL: http://127.0.0.1:8081
      BACKEND_PUBLIC_URL: http://127.0.0.1:3001
      DATABASE_URL: postgresql://user:password@localhost:5432/divo
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_QUEUE_URL: redis://127.0.0.1:6379/1
      REDIS_CACHE_URL: redis://127.0.0.1:6379/2
      REDIS_MEMORY_URL: redis://127.0.0.1:6379/3
      OPENAI_API_KEY: test-openai-key
      GOOGLE_GENERATIVE_AI_API_KEY: test-google-key
      GEMINI_API_KEY: test-google-key
      GROQ_API_KEY: test-groq-key
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_API_KEY: test-qdrant-key
      ADMIN_JWT_SECRET: test-admin-jwt-secret
      MEMBER_JWT_SECRET: test-member-jwt-secret
      CLOUDINARY_CLOUD_NAME: test-cloud
      CLOUDINARY_API_KEY: test-cloudinary-key
      CLOUDINARY_API_SECRET: test-cloudinary-secret
      ZOHO_TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      DATA_EXPORT_UNISOLATED_TEST_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # The selected divo-pi runtime files below let backend tests check that
        # the compiled model catalogue, governed allowlist, and capability
        # finalization still agree across the container/backend boundary.
        # They are static imports, so a missing file is not a skipped test but a
        # suite that cannot load: `advance-backend` has been red on main and dev
        # since the allowlist parity test arrived without the two paths it reads.
        with:
          sparse-checkout: |
            advance-backend
            divo-pi/divo/runtime-models.mjs
            divo-pi/divo/runtime-manifest.json
            divo-pi/divo/extensions/divo-gateway/typed-tools.ts
            divo-pi/divo/extensions/divo-gateway/native-tools/catalogue-contract.ts
            divo-pi/divo/extensions/divo-gateway/native-tools/generated
            divo-pi/divo/extensions/divo-gateway/native-tools/semrush-contract.ts

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: advance-backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify compiled Pi-native tool catalogue
        run: pnpm check:pi-native-tools

      - name: Test
        # Live integration suites auto-skip when service credentials are absent.
        # Do not provide placeholder Lark/Google/Zoho credentials here; they make
        # the suites attempt real API calls with invalid tokens.
        run: pnpm test

  admin:
    name: admin
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.deploy_development == true) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      VITE_API_BASE_URL: http://127.0.0.1:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: admin

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  divo-pi:
    name: divo-pi
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.deploy_development == true) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: divo-pi
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: divo-pi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: divo-pi/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check Divo runtime, controller, and extensions
        run: npm run divo:check

  verify-development-source:
    name: verify-development-source
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.deploy_development == true
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Dev push CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          passed="$(gh run list --workflow ci.yml --branch dev --event push \
            --commit "${GITHUB_SHA}" --status success --limit 1 \
            --json databaseId --jq 'length')"
          test "${passed}" = 1

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs:
      - advance-backend
      - admin
      - divo-pi
      - verify-development-source
    if: >-
      ${{
        always() &&
        (
          (
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/dev' &&
            inputs.deploy_development == true &&
            needs.verify-development-source.result == 'success' &&
            needs.advance-backend.result == 'skipped' &&
            needs.admin.result == 'skipped' &&
            needs.divo-pi.result == 'skipped'
          ) ||
          (
            !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.deploy_development == true) &&
            needs.verify-development-source.result == 'skipped' &&
            needs.advance-backend.result == 'success' &&
            needs.admin.result == 'success' &&
            needs.divo-pi.result == 'success'
          )
        )
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            advance-backend
            admin
            divo-pi

      - name: Set up Docker Buildx
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.deploy_development == true) }}
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.deploy_development == true) }}
        uses: docker/build-push-action@v7
        with:
          context: ./advance-backend
          load: true
          tags: divo-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build admin image
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.deploy_development == true) }}
        uses: docker/build-push-action@v7
        with:
          context: ./admin
          load: true
          tags: divo-admin:ci
          build-args: VITE_API_BASE_URL=http://127.0.0.1:3001
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

      - name: Build Pi runtime image
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.deploy_development == true) }}
        uses: docker/build-push-action@v7
        with:
          context: ./divo-pi
          load: true
          tags: divo-pi:ci
          cache-from: type=gha,scope=pi
          cache-to: type=gha,mode=max,scope=pi

      - name: Build Pi controller image
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.deploy_development == true) }}
        uses: docker/build-push-action@v7
        with:
          context: ./divo-pi
          file: ./divo-pi/Dockerfile.controller
          load: true
          tags: divo-pi-controller:ci
          cache-from: type=gha,scope=pi-controller
          cache-to: type=gha,mode=max,scope=pi-controller

      - name: Validate Pi controller image
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.deploy_development == true) }}
        run: >-
          docker run --rm --entrypoint node divo-pi-controller:ci
          --input-type=module --eval "await import('./divo/local-rpc-server.mjs')"

      - name: Validate Compose config
        run: DIVO_ENV_FILE=/dev/null docker compose --env-file .env.production.example config >/dev/null

      - name: Validate development Compose config
        run: |
          DIVO_DEV_ENV_FILE=/dev/null \
          DIVO_DEV_BACKEND_IMAGE=divo-backend:ci \
          DIVO_DEV_ADMIN_IMAGE=divo-admin:ci \
          DIVO_DEV_PI_IMAGE=divo-pi:ci \
          DIVO_DEV_PI_CONTROLLER_IMAGE=divo-pi-controller:ci \
          DIVO_DEV_POSTGRES_PASSWORD=ci-placeholder \
          DIVO_DEV_PUBLIC_URL=https://app-dev.103.172.92.187.sslip.io \
          HINDSIGHT_LLM_API_KEY=ci-placeholder \
          docker compose -f docker-compose.dev.yml config >/dev/null

  publish-development-images:
    name: publish-development-images
    runs-on: ubuntu-latest
    needs:
      - docker-build
    if: >-
      ${{
        always() &&
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/dev' &&
        inputs.deploy_development == true &&
        needs.docker-build.result == 'success'
      }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./advance-backend
            file: ./advance-backend/Dockerfile
            checkout_path: advance-backend
            build-args: ""
          - component: admin
            context: ./admin
            file: ./admin/Dockerfile
            checkout_path: admin
            build-args: VITE_API_BASE_URL=
          - component: pi
            context: ./divo-pi
            file: ./divo-pi/Dockerfile
            checkout_path: divo-pi
            build-args: ""
          - component: pi-controller
            context: ./divo-pi
            file: ./divo-pi/Dockerfile.controller
            checkout_path: divo-pi
            build-args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: ${{ matrix.checkout_path }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component }} image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/relicwavetechnologies/zoho-automation/${{ matrix.component }}:dev-${{ github.sha }}
          labels: |
            com.divo.environment=development
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Record ${{ matrix.component }} release image
        run: |
          {
            echo "### Development image: ${{ matrix.component }}"
            echo "- Tag: \`dev-${GITHUB_SHA}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Build cache and timing details are attached in the Docker build summary."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify backend image revision label
        if: matrix.component == 'backend'
        env:
          IMAGE: ghcr.io/relicwavetechnologies/zoho-automation/${{ matrix.component }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "${IMAGE}"
          actual="$(docker image inspect "${IMAGE}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [[ "${actual}" != "${GITHUB_SHA}" ]]; then
            echo "Backend image revision label mismatch." >&2
            echo "expected=${GITHUB_SHA}" >&2
            echo "actual=${actual}" >&2
            exit 1
          fi

      - name: Smoke published Pi image
        if: matrix.component == 'pi' || matrix.component == 'pi-controller'
        env:
          IMAGE: ghcr.io/relicwavetechnologies/zoho-automation/${{ matrix.component }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "${IMAGE}"
          if [[ "${{ matrix.component }}" == "pi" ]]; then
            docker run --rm --network none --entrypoint npm "${IMAGE}" run divo:check
            docker run --rm --network none --tmpfs /data:rw,uid=10001,gid=10001 \
              --entrypoint /app/node_modules/.bin/tsx "${IMAGE}" \
              packages/coding-agent/src/cli.ts --version
          else
            name="divo-controller-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            prefix="divo-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            trap 'docker rm -f "${name}" >/dev/null 2>&1 || true' EXIT
            docker run -d --name "${name}" --network none \
              -e DIVO_PI_RESOURCE_PREFIX="${prefix}" \
              -v /var/run/docker.sock:/var/run/docker.sock "${IMAGE}"
            for attempt in $(seq 1 20); do
              if docker exec "${name}" node -e \
                "fetch('http://127.0.0.1:4317/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                exit 0
              fi
              [[ "$(docker inspect --format '{{.State.Running}}' "${name}")" == true ]] || break
              sleep 0.25
            done
            docker logs "${name}"
            exit 1
          fi

      - name: Promote ${{ matrix.component }} development alias
        env:
          IMAGE: ghcr.io/relicwavetechnologies/zoho-automation/${{ matrix.component }}@${{ steps.build.outputs.digest }}
          LATEST: ghcr.io/relicwavetechnologies/zoho-automation/${{ matrix.component }}:dev-latest
        run: docker buildx imagetools create --tag "${LATEST}" "${IMAGE}"

  deploy-development:
    name: deploy-development
    runs-on: ubuntu-latest
    needs:
      - publish-development-images
    if: >-
      ${{
        always() &&
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/dev' &&
        inputs.deploy_development == true &&
        needs.publish-development-images.result == 'success'
      }}
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: /opt/divo-dev
      DIVO_DEV_DOMAIN: app-dev.103.172.92.187.sslip.io
      DIVO_DEV_HOST: 103.172.92.187
      DIVO_DEV_USER: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /docker-compose.dev.yml
            /infra/development/developer-authorized-keys
          sparse-checkout-cone-mode: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve development images by digest
        env:
          IMAGE_PREFIX: ghcr.io/relicwavetechnologies/zoho-automation
          RELEASE_TAG: dev-${{ github.sha }}
        run: |
          resolve() {
            local component="$1" variable="$2" image digest
            image="${IMAGE_PREFIX}/${component}:${RELEASE_TAG}"
            digest="$(docker buildx imagetools inspect "${image}" --format '{{.Manifest.Digest}}')"
            test -n "${digest}"
            printf '%s=%s@%s\n' "${variable}" "${IMAGE_PREFIX}/${component}" "${digest}" >> "${GITHUB_ENV}"
          }
          resolve backend BACKEND_IMAGE
          resolve admin ADMIN_IMAGE
          resolve pi PI_IMAGE
          resolve pi-controller PI_CONTROLLER_IMAGE

      - name: Start deployment timer
        run: echo "DEPLOY_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Validate deployment secrets
        env:
          DIVO_DEV_SSH_KEY: ${{ secrets.DIVO_DEV_SSH_KEY }}
          DEVELOPMENT_ENV_FILE: ${{ secrets.DEVELOPMENT_ENV_FILE }}
        run: |
          test -n "${DIVO_DEV_SSH_KEY}"
          # Checked before anything is written rather than after: an empty
          # secret would otherwise truncate the environment on the box and take
          # the stack down with a deploy that reported success.
          test -n "${DEVELOPMENT_ENV_FILE}"

      - name: Configure SSH
        env:
          DIVO_DEV_SSH_KEY: ${{ secrets.DIVO_DEV_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DIVO_DEV_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '103.172.92.187 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICer9x9ARy2oBqzIGOALmDDLZPwpIfEmbXuutFu53Nuy' >> ~/.ssh/known_hosts

      # Written from the secret rather than maintained by hand on the box, so a
      # reprovisioned development host comes back with the same environment
      # instead of whatever was last typed into it. `main` has done this since
      # its first deploy; development had not, which is how its Lark app came to
      # differ from the one being tested against with nothing in the repository
      # to say so.
      #
      # The consequence is worth stating plainly: this file is now derived. An
      # edit made over SSH survives until the next deploy and is then gone, so a
      # value that must persist belongs in DEVELOPMENT_ENV_FILE.
      - name: Upload development environment
        env:
          DEVELOPMENT_ENV_FILE: ${{ secrets.DEVELOPMENT_ENV_FILE }}
        run: |
          printf '%s' "${DEVELOPMENT_ENV_FILE}" | ssh -i ~/.ssh/id_ed25519 \
            "${DIVO_DEV_USER}@${DIVO_DEV_HOST}" \
            "install -d -m 700 '${DEPLOY_DIR}' && \
             if test -s '${DEPLOY_DIR}/.env.development.local'; then \
               cp -p '${DEPLOY_DIR}/.env.development.local' \
                     '${DEPLOY_DIR}/.release-rollback.env.development.local'; \
             fi && \
             cat > '${DEPLOY_DIR}/.env.development.local' && \
             chmod 600 '${DEPLOY_DIR}/.env.development.local'"

      - name: Verify development environment is provisioned
        run: |
          ssh -i ~/.ssh/id_ed25519 "${DIVO_DEV_USER}@${DIVO_DEV_HOST}" \
            "test -s '${DEPLOY_DIR}/.env.development.local' && command -v docker >/dev/null && docker compose version >/dev/null"

      - name: Authorize development tunnel keys
        run: |
          scp -i ~/.ssh/id_ed25519 \
            infra/development/developer-authorized-keys \
            "${DIVO_DEV_USER}@${DIVO_DEV_HOST}:/tmp/divo-development-authorized-keys"
          ssh -i ~/.ssh/id_ed25519 "${DIVO_DEV_USER}@${DIVO_DEV_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          install -m 700 -d ~/.ssh
          touch ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          while IFS= read -r key; do
            [[ -z "${key}" ]] && continue
            grep -qxF "${key}" ~/.ssh/authorized_keys || printf '%s\n' "${key}" >> ~/.ssh/authorized_keys
          done < /tmp/divo-development-authorized-keys
          rm -f /tmp/divo-development-authorized-keys
          REMOTE

      - name: Upload development configuration
        run: |
          ssh -i ~/.ssh/id_ed25519 "${DIVO_DEV_USER}@${DIVO_DEV_HOST}" \
            "install -d -m 700 '${DEPLOY_DIR}'"
          scp -i ~/.ssh/id_ed25519 \
            docker-compose.dev.yml \
            "${DIVO_DEV_USER}@${DIVO_DEV_HOST}:${DEPLOY_DIR}/docker-compose.yml"

      - name: Persist development release image pins
        run: |
          ssh -i ~/.ssh/id_ed25519 "${DIVO_DEV_USER}@${DIVO_DEV_HOST}" \
            "DEPLOY_DIR='${DEPLOY_DIR}' BACKEND_IMAGE='${BACKEND_IMAGE}' ADMIN_IMAGE='${ADMIN_IMAGE}' PI_IMAGE='${PI_IMAGE}' PI_CONTROLLER_IMAGE='${PI_CONTROLLER_IMAGE}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "${DEPLOY_DIR}"

          require_digest() {
            local name="$1" value="$2"
            case "${value}" in
              *@sha256:*) ;;
              *) echo "${name} must be pinned by digest, got ${value}" >&2; exit 1 ;;
            esac
          }

          upsert_env() {
            local file="$1" key="$2" value="$3" tmp
            tmp="$(mktemp)"
            awk -v key="${key}" -v value="${value}" '
              BEGIN { written = 0 }
              $0 ~ "^(export[[:space:]]+)?" key "=" {
                print key "=" value
                written = 1
                next
              }
              { print }
              END {
                if (!written) print key "=" value
              }
            ' "${file}" > "${tmp}"
            cat "${tmp}" > "${file}"
            rm -f "${tmp}"
          }

          require_digest DIVO_DEV_BACKEND_IMAGE "${BACKEND_IMAGE}"
          require_digest DIVO_DEV_ADMIN_IMAGE "${ADMIN_IMAGE}"
          require_digest DIVO_DEV_PI_IMAGE "${PI_IMAGE}"
          require_digest DIVO_DEV_PI_CONTROLLER_IMAGE "${PI_CONTROLLER_IMAGE}"
          upsert_env .env.development.local DIVO_DEV_BACKEND_IMAGE "${BACKEND_IMAGE}"
          upsert_env .env.development.local DIVO_DEV_ADMIN_IMAGE "${ADMIN_IMAGE}"
          upsert_env .env.development.local DIVO_DEV_PI_IMAGE "${PI_IMAGE}"
          upsert_env .env.development.local DIVO_DEV_PI_CONTROLLER_IMAGE "${PI_CONTROLLER_IMAGE}"
          chmod 600 .env.development.local
          REMOTE

      - name: Retire removed Development dataExport storage when present
        run: |
          ssh -i ~/.ssh/id_ed25519 "${DIVO_DEV_USER}@${DIVO_DEV_HOST}" \
            "DEPLOY_DIR='${DEPLOY_DIR}' BACKEND_IMAGE='${BACKEND_IMAGE}' ADMIN_IMAGE='${ADMIN_IMAGE}' PI_IMAGE='${PI_IMAGE}' PI_CONTROLLER_IMAGE='${PI_CONTROLLER_IMAGE}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "${DEPLOY_DIR}"
          export DIVO_DEV_ENV_FILE=.env.development.local
          export DIVO_DEV_BACKEND_IMAGE="${BACKEND_IMAGE}"
          export DIVO_DEV_ADMIN_IMAGE="${ADMIN_IMAGE}"
          export DIVO_DEV_PI_IMAGE="${PI_IMAGE}"
          export DIVO_DEV_PI_CONTROLLER_IMAGE="${PI_CONTROLLER_IMAGE}"

          timeout 600s docker compose --env-file .env.development.local pull divo-dev-backend
          timeout 240s docker compose --env-file .env.development.local up -d --wait --wait-timeout 180 \
            divo-dev-postgres divo-dev-redis-queue
          needs_retirement=0
          docker compose --env-file .env.development.local run --rm --no-deps \
            divo-dev-backend pnpm retire:data-export -- --needs-apply >/dev/null \
            || needs_retirement=$?
          if [[ "${needs_retirement}" == "0" ]]; then
            docker compose --env-file .env.development.local stop divo-dev-backend >/dev/null 2>&1 || true
            install -d -m 700 backups
            retirement_backup="backups/development-data-export-retirement-$(date -u +%Y%m%dT%H%M%SZ).dump"
            docker compose --env-file .env.development.local exec -T divo-dev-postgres sh -lc \
              'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "${retirement_backup}"
            test -s "${retirement_backup}"
            chmod 600 "${retirement_backup}"
            if ! docker compose --env-file .env.development.local run --rm --no-deps \
              -e DATA_EXPORT_RETIRE_CONFIRM=delete-retired-data-export-storage \
              divo-dev-backend pnpm retire:data-export -- --apply </dev/null; then
              docker compose --env-file .env.development.local start divo-dev-backend || true
              exit 1
            fi
          elif [[ "${needs_retirement}" != "3" ]]; then
            exit "${needs_retirement}"
          fi
          REMOTE

      - name: Pull images, migrate, and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | ssh -i ~/.ssh/id_ed25519 "${DIVO_DEV_USER}@${DIVO_DEV_HOST}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

          ssh -i ~/.ssh/id_ed25519 "${DIVO_DEV_USER}@${DIVO_DEV_HOST}" \
            "cd '${DEPLOY_DIR}' && \
             case '${BACKEND_IMAGE} ${ADMIN_IMAGE} ${PI_IMAGE} ${PI_CONTROLLER_IMAGE}' in *:main-latest*|*:latest*|*:dev-latest*) echo 'Mutable image tag refused in development deploy.' >&2; exit 1 ;; esac && \
             DIVO_DEV_ENV_FILE=.env.development.local \
             DIVO_DEV_BACKEND_IMAGE='${BACKEND_IMAGE}' \
             DIVO_DEV_ADMIN_IMAGE='${ADMIN_IMAGE}' \
             DIVO_DEV_PI_IMAGE='${PI_IMAGE}' \
             DIVO_DEV_PI_CONTROLLER_IMAGE='${PI_CONTROLLER_IMAGE}' \
             timeout 600s docker compose --env-file .env.development.local pull && \
             timeout 300s docker pull '${PI_IMAGE}' && \
             DIVO_DEV_ENV_FILE=.env.development.local \
             DIVO_DEV_BACKEND_IMAGE='${BACKEND_IMAGE}' \
             DIVO_DEV_ADMIN_IMAGE='${ADMIN_IMAGE}' \
             DIVO_DEV_PI_IMAGE='${PI_IMAGE}' \
             DIVO_DEV_PI_CONTROLLER_IMAGE='${PI_CONTROLLER_IMAGE}' \
             timeout 240s docker compose --env-file .env.development.local up -d --wait --wait-timeout 180 divo-dev-postgres divo-dev-redis-queue divo-dev-redis-cache divo-dev-redis-memory && \
             DIVO_DEV_ENV_FILE=.env.development.local \
             DIVO_DEV_BACKEND_IMAGE='${BACKEND_IMAGE}' \
             DIVO_DEV_ADMIN_IMAGE='${ADMIN_IMAGE}' \
             DIVO_DEV_PI_IMAGE='${PI_IMAGE}' \
             DIVO_DEV_PI_CONTROLLER_IMAGE='${PI_CONTROLLER_IMAGE}' \
             docker compose --env-file .env.development.local run --rm --no-deps divo-dev-backend pnpm prisma db execute --file prisma/migrations/20260731_drop_scheduled_workflow_origin_chat/migration.sql --schema prisma/schema.prisma && \
             DIVO_DEV_ENV_FILE=.env.development.local \
             DIVO_DEV_BACKEND_IMAGE='${BACKEND_IMAGE}' \
             DIVO_DEV_ADMIN_IMAGE='${ADMIN_IMAGE}' \
             DIVO_DEV_PI_IMAGE='${PI_IMAGE}' \
             DIVO_DEV_PI_CONTROLLER_IMAGE='${PI_CONTROLLER_IMAGE}' \
             docker compose --env-file .env.development.local run --rm --no-deps divo-dev-backend pnpm prisma db push --skip-generate && \
             DIVO_DEV_ENV_FILE=.env.development.local \
             DIVO_DEV_BACKEND_IMAGE='${BACKEND_IMAGE}' \
             DIVO_DEV_ADMIN_IMAGE='${ADMIN_IMAGE}' \
             DIVO_DEV_PI_IMAGE='${PI_IMAGE}' \
             DIVO_DEV_PI_CONTROLLER_IMAGE='${PI_CONTROLLER_IMAGE}' \
             docker compose --env-file .env.development.local run --rm --no-deps divo-dev-backend pnpm tsx scripts/seed-registered-tools.ts && \
             DIVO_DEV_ENV_FILE=.env.development.local \
             DIVO_DEV_BACKEND_IMAGE='${BACKEND_IMAGE}' \
             DIVO_DEV_ADMIN_IMAGE='${ADMIN_IMAGE}' \
             DIVO_DEV_PI_IMAGE='${PI_IMAGE}' \
             DIVO_DEV_PI_CONTROLLER_IMAGE='${PI_CONTROLLER_IMAGE}' \
             docker compose --env-file .env.development.local run --rm --no-deps divo-dev-backend pnpm provision:google-workspace-skills && \
             DIVO_DEV_ENV_FILE=.env.development.local \
             DIVO_DEV_BACKEND_IMAGE='${BACKEND_IMAGE}' \
             DIVO_DEV_ADMIN_IMAGE='${ADMIN_IMAGE}' \
             DIVO_DEV_PI_IMAGE='${PI_IMAGE}' \
             DIVO_DEV_PI_CONTROLLER_IMAGE='${PI_CONTROLLER_IMAGE}' \
             docker compose --env-file .env.development.local up -d --no-build --remove-orphans"

      - name: Smoke test the local stack and HTTPS route
        run: |
          ssh -i ~/.ssh/id_ed25519 "${DIVO_DEV_USER}@${DIVO_DEV_HOST}" \
            "DIVO_DEV_DOMAIN='${DIVO_DEV_DOMAIN}' DEPLOY_DIR='${DEPLOY_DIR}' DIVO_DEV_BACKEND_IMAGE='${BACKEND_IMAGE}' DIVO_DEV_ADMIN_IMAGE='${ADMIN_IMAGE}' DIVO_DEV_PI_IMAGE='${PI_IMAGE}' DIVO_DEV_PI_CONTROLLER_IMAGE='${PI_CONTROLLER_IMAGE}' bash -s" <<'REMOTE'
          set -euo pipefail

          case "${DIVO_DEV_BACKEND_IMAGE} ${DIVO_DEV_ADMIN_IMAGE} ${DIVO_DEV_PI_IMAGE} ${DIVO_DEV_PI_CONTROLLER_IMAGE}" in
            *:main-latest*|*:latest*|*:dev-latest*) echo "Mutable image tag refused in development smoke test." >&2; exit 1 ;;
          esac

          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 http://127.0.0.1:13001/health >/dev/null \
              && curl -fsS --max-time 10 http://127.0.0.1:18081/ >/dev/null \
              && curl -fsS --max-time 15 --resolve "${DIVO_DEV_DOMAIN}:443:127.0.0.1" "https://${DIVO_DEV_DOMAIN}/" >/dev/null \
              && cd "${DEPLOY_DIR}" \
              && DIVO_DEV_BACKEND_IMAGE="${DIVO_DEV_BACKEND_IMAGE}" \
                 DIVO_DEV_ADMIN_IMAGE="${DIVO_DEV_ADMIN_IMAGE}" \
                 DIVO_DEV_PI_IMAGE="${DIVO_DEV_PI_IMAGE}" \
                 DIVO_DEV_PI_CONTROLLER_IMAGE="${DIVO_DEV_PI_CONTROLLER_IMAGE}" \
                 docker compose --env-file .env.development.local exec -T divo-dev-backend \
                 node -e "fetch('http://divo-dev-pi-controller:4317/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" \
              && test "$(
                 docker exec divo-development-divo-dev-postgres-1 sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At' <<'SQL'
          select coalesce(bool_or(markdown like '%Do not require `Order Sub Status` = Regular Order by default%'), false)
          from "Skill"
          where slug = 'airtable-core';
          SQL
              )" = "t"; then
              cd "${DEPLOY_DIR}"
              DIVO_DEV_BACKEND_IMAGE="${DIVO_DEV_BACKEND_IMAGE}" \
              DIVO_DEV_ADMIN_IMAGE="${DIVO_DEV_ADMIN_IMAGE}" \
              DIVO_DEV_PI_IMAGE="${DIVO_DEV_PI_IMAGE}" \
              DIVO_DEV_PI_CONTROLLER_IMAGE="${DIVO_DEV_PI_CONTROLLER_IMAGE}" \
                docker compose --env-file .env.development.local ps
              exit 0
            fi

            sleep 5
          done

          cd "${DEPLOY_DIR}"
          DIVO_DEV_BACKEND_IMAGE="${DIVO_DEV_BACKEND_IMAGE}" \
          DIVO_DEV_ADMIN_IMAGE="${DIVO_DEV_ADMIN_IMAGE}" \
          DIVO_DEV_PI_IMAGE="${DIVO_DEV_PI_IMAGE}" \
          DIVO_DEV_PI_CONTROLLER_IMAGE="${DIVO_DEV_PI_CONTROLLER_IMAGE}" \
            docker compose --env-file .env.development.local ps
          DIVO_DEV_BACKEND_IMAGE="${DIVO_DEV_BACKEND_IMAGE}" \
          DIVO_DEV_ADMIN_IMAGE="${DIVO_DEV_ADMIN_IMAGE}" \
          DIVO_DEV_PI_IMAGE="${DIVO_DEV_PI_IMAGE}" \
          DIVO_DEV_PI_CONTROLLER_IMAGE="${DIVO_DEV_PI_CONTROLLER_IMAGE}" \
            docker compose --env-file .env.development.local logs --tail=160 divo-dev-backend divo-dev-admin google-workspace-mcp divo-dev-pi-controller
          exit 1
          REMOTE

      - name: Record deployment duration
        if: ${{ always() }}
        run: |
          elapsed=$(( $(date +%s) - DEPLOY_STARTED_AT ))
          {
            echo "### Development deployment"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Duration: $((elapsed / 60))m $((elapsed % 60))s"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
