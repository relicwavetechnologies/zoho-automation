name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.33.4
  NODE_VERSION: 22

jobs:
  advance-backend:
    name: advance-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: advance-backend
    env:
      NODE_ENV: test
      PORT: 3001
      APP_BASE_URL: http://127.0.0.1:8081
      BACKEND_PUBLIC_URL: http://127.0.0.1:3001
      DATABASE_URL: postgresql://user:password@localhost:5432/divo
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_QUEUE_URL: redis://127.0.0.1:6379/1
      REDIS_CACHE_URL: redis://127.0.0.1:6379/2
      REDIS_MEMORY_URL: redis://127.0.0.1:6379/3
      OPENAI_API_KEY: test-openai-key
      GOOGLE_GENERATIVE_AI_API_KEY: test-google-key
      GEMINI_API_KEY: test-google-key
      GROQ_API_KEY: test-groq-key
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_API_KEY: test-qdrant-key
      ADMIN_JWT_SECRET: test-admin-jwt-secret
      MEMBER_JWT_SECRET: test-member-jwt-secret
      CLOUDINARY_CLOUD_NAME: test-cloud
      CLOUDINARY_API_KEY: test-cloudinary-key
      CLOUDINARY_API_SECRET: test-cloudinary-secret
      ZOHO_TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: advance-backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # Live integration suites auto-skip when service credentials are absent.
        # Do not provide placeholder Lark/Google/Zoho credentials here; they make
        # the suites attempt real API calls with invalid tokens.
        run: pnpm test

  admin:
    name: admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      VITE_API_BASE_URL: http://127.0.0.1:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs:
      - advance-backend
      - admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t divo-backend:ci ./advance-backend

      - name: Build admin image
        run: docker build --build-arg VITE_API_BASE_URL=http://127.0.0.1:3001 -t divo-admin:ci ./admin

      - name: Validate Compose config
        run: DIVO_ENV_FILE=/dev/null docker compose --env-file .env.production.example config >/dev/null

      - name: Validate development Compose config
        run: |
          DIVO_DEV_ENV_FILE=/dev/null \
          DIVO_DEV_BACKEND_IMAGE=divo-backend:ci \
          DIVO_DEV_ADMIN_IMAGE=divo-admin:ci \
          DIVO_DEV_POSTGRES_PASSWORD=ci-placeholder \
          DIVO_DEV_PUBLIC_URL=https://app-dev.103.172.92.187.sslip.io \
          docker compose -f docker-compose.dev.yml config >/dev/null

  publish-development-images:
    name: publish-development-images
    runs-on: ubuntu-latest
    needs:
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
      backend-image: ${{ steps.meta.outputs.backend-image }}
      admin-image: ${{ steps.meta.outputs.admin-image }}
    steps:
      - name: Resolve image metadata
        id: meta
        run: |
          IMAGE_TAG="dev-${GITHUB_SHA}"
          BACKEND_IMAGE="ghcr.io/relicwavetechnologies/zoho-automation/backend:${IMAGE_TAG}"
          ADMIN_IMAGE="ghcr.io/relicwavetechnologies/zoho-automation/admin:${IMAGE_TAG}"

          echo "image-tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "backend-image=${BACKEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "admin-image=${ADMIN_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push backend image
        run: |
          docker build \
            --label com.divo.environment=development \
            -t "${{ steps.meta.outputs.backend-image }}" \
            -t ghcr.io/relicwavetechnologies/zoho-automation/backend:dev-latest \
            ./advance-backend

          docker push "${{ steps.meta.outputs.backend-image }}"
          docker push ghcr.io/relicwavetechnologies/zoho-automation/backend:dev-latest

      - name: Build and push admin image
        run: |
          docker build \
            --label com.divo.environment=development \
            --build-arg VITE_API_BASE_URL="" \
            -t "${{ steps.meta.outputs.admin-image }}" \
            -t ghcr.io/relicwavetechnologies/zoho-automation/admin:dev-latest \
            ./admin

          docker push "${{ steps.meta.outputs.admin-image }}"
          docker push ghcr.io/relicwavetechnologies/zoho-automation/admin:dev-latest

  deploy-development:
    name: deploy-development
    runs-on: ubuntu-latest
    needs:
      - publish-development-images
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: /opt/divo-dev
      DIVO_DEV_DOMAIN: app-dev.103.172.92.187.sslip.io
      DIVO_DEV_HOST: 103.172.92.187
      DIVO_DEV_USER: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          DIVO_DEV_SSH_KEY: ${{ secrets.DIVO_DEV_SSH_KEY }}
        run: |
          test -n "${DIVO_DEV_SSH_KEY}"

      - name: Configure SSH
        env:
          DIVO_DEV_SSH_KEY: ${{ secrets.DIVO_DEV_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DIVO_DEV_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '103.172.92.187 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICer9x9ARy2oBqzIGOALmDDLZPwpIfEmbXuutFu53Nuy' >> ~/.ssh/known_hosts

      - name: Verify development environment is provisioned
        run: |
          ssh -i ~/.ssh/id_ed25519 "${DIVO_DEV_USER}@${DIVO_DEV_HOST}" \
            "test -r '${DEPLOY_DIR}/.env.development.local' && command -v docker >/dev/null && docker compose version >/dev/null"

      - name: Upload development configuration
        run: |
          ssh -i ~/.ssh/id_ed25519 "${DIVO_DEV_USER}@${DIVO_DEV_HOST}" \
            "install -d -m 700 '${DEPLOY_DIR}'"
          scp -i ~/.ssh/id_ed25519 \
            docker-compose.dev.yml \
            "${DIVO_DEV_USER}@${DIVO_DEV_HOST}:${DEPLOY_DIR}/docker-compose.yml"

      - name: Pull images, migrate, and restart
        env:
          BACKEND_IMAGE: ${{ needs.publish-development-images.outputs.backend-image }}
          ADMIN_IMAGE: ${{ needs.publish-development-images.outputs.admin-image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | ssh -i ~/.ssh/id_ed25519 "${DIVO_DEV_USER}@${DIVO_DEV_HOST}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

          ssh -i ~/.ssh/id_ed25519 "${DIVO_DEV_USER}@${DIVO_DEV_HOST}" \
            "cd '${DEPLOY_DIR}' && \
             DIVO_DEV_ENV_FILE=.env.development.local \
             DIVO_DEV_BACKEND_IMAGE='${BACKEND_IMAGE}' \
             DIVO_DEV_ADMIN_IMAGE='${ADMIN_IMAGE}' \
             docker compose --env-file .env.development.local pull && \
             DIVO_DEV_ENV_FILE=.env.development.local \
             DIVO_DEV_BACKEND_IMAGE='${BACKEND_IMAGE}' \
             DIVO_DEV_ADMIN_IMAGE='${ADMIN_IMAGE}' \
             docker compose --env-file .env.development.local run --rm --no-deps divo-dev-backend pnpm prisma db push --skip-generate && \
             DIVO_DEV_ENV_FILE=.env.development.local \
             DIVO_DEV_BACKEND_IMAGE='${BACKEND_IMAGE}' \
             DIVO_DEV_ADMIN_IMAGE='${ADMIN_IMAGE}' \
             docker compose --env-file .env.development.local up -d --no-build --remove-orphans && \
             docker image prune -af --filter 'label=com.divo.environment=development'"

      - name: Smoke test the local stack and HTTPS route
        run: |
          ssh -i ~/.ssh/id_ed25519 "${DIVO_DEV_USER}@${DIVO_DEV_HOST}" \
            "DIVO_DEV_DOMAIN='${DIVO_DEV_DOMAIN}' DEPLOY_DIR='${DEPLOY_DIR}' bash -s" <<'REMOTE'
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 http://127.0.0.1:13001/health >/dev/null \
              && curl -fsS --max-time 10 http://127.0.0.1:18081/ >/dev/null \
              && curl -fsS --max-time 15 --resolve "${DIVO_DEV_DOMAIN}:443:127.0.0.1" "https://${DIVO_DEV_DOMAIN}/" >/dev/null; then
              cd "${DEPLOY_DIR}"
              docker compose --env-file .env.development.local ps
              exit 0
            fi

            sleep 5
          done

          cd "${DEPLOY_DIR}"
          docker compose --env-file .env.development.local ps
          docker compose --env-file .env.development.local logs --tail=160 divo-dev-backend divo-dev-admin
          exit 1
          REMOTE
