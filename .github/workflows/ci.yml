name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.33.4
  NODE_VERSION: 22

jobs:
  advance-backend:
    name: advance-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: advance-backend
    env:
      NODE_ENV: test
      PORT: 3001
      APP_BASE_URL: http://127.0.0.1:8081
      BACKEND_PUBLIC_URL: http://127.0.0.1:3001
      DATABASE_URL: postgresql://user:password@localhost:5432/divo
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_QUEUE_URL: redis://127.0.0.1:6379/1
      REDIS_CACHE_URL: redis://127.0.0.1:6379/2
      REDIS_MEMORY_URL: redis://127.0.0.1:6379/3
      OPENAI_API_KEY: test-openai-key
      GOOGLE_GENERATIVE_AI_API_KEY: test-google-key
      GEMINI_API_KEY: test-google-key
      GROQ_API_KEY: test-groq-key
      LARK_APP_ID: cli_test
      LARK_APP_SECRET: test-lark-secret
      LARK_VERIFICATION_TOKEN: test-lark-token
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_API_KEY: test-qdrant-key
      ADMIN_JWT_SECRET: test-admin-jwt-secret
      MEMBER_JWT_SECRET: test-member-jwt-secret
      CLOUDINARY_CLOUD_NAME: test-cloud
      CLOUDINARY_API_KEY: test-cloudinary-key
      CLOUDINARY_API_SECRET: test-cloudinary-secret
      ZOHO_CLIENT_ID: test-zoho-client
      ZOHO_CLIENT_SECRET: test-zoho-secret
      ZOHO_TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      GOOGLE_OAUTH_CLIENT_ID: test-google-client
      GOOGLE_OAUTH_CLIENT_SECRET: test-google-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: advance-backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  admin:
    name: admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      VITE_API_BASE_URL: http://127.0.0.1:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs:
      - advance-backend
      - admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t divo-backend:ci ./advance-backend

      - name: Build admin image
        run: docker build --build-arg VITE_API_BASE_URL=http://127.0.0.1:3001 -t divo-admin:ci ./admin

      - name: Validate Compose config
        run: docker compose --env-file .env.production.example config >/dev/null

