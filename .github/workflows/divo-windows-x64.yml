name: Divo Windows x64

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'jan/**'
      - '.github/workflows/divo-windows-x64.yml'

concurrency:
  group: divo-windows-x64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Build Windows x64 installer
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: jan
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Configure Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn config set -H enableImmutableInstalls false

      - name: Install dependencies
        run: yarn install

      - name: Verify Windows bundle contract
        run: yarn test:package-scripts

      - name: Build Windows x64 installers
        run: yarn build:windows:x64
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          GH_TOKEN: ${{ github.token }}

      - name: Verify installers exist
        shell: pwsh
        run: |
          $nsis = Get-ChildItem 'jan/src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction Stop
          $msi = Get-ChildItem 'jan/src-tauri/target/release/bundle/msi/*.msi' -ErrorAction Stop
          Write-Host "NSIS: $($nsis.FullName)"
          Write-Host "MSI: $($msi.FullName)"

      - name: Upload Windows installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: divo-windows-x64-${{ github.sha }}
          path: |
            jan/src-tauri/target/release/bundle/nsis/*.exe
            jan/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
