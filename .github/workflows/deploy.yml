name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: relicwavetechnologies/zoho-automation
  DEPLOY_DIR: /opt/divo

jobs:
  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
      backend-image: ${{ steps.meta.outputs.backend-image }}
      admin-image: ${{ steps.meta.outputs.admin-image }}
    steps:
      - name: Resolve image metadata
        id: meta
        run: |
          IMAGE_TAG="${{ github.event.workflow_run.head_sha || github.sha }}"
          BACKEND_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/backend:${IMAGE_TAG}"
          ADMIN_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/admin:${IMAGE_TAG}"

          echo "image-tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "backend-image=${BACKEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "admin-image=${ADMIN_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.image-tag }}

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Build and push backend image
        run: |
          docker build \
            -t "${{ steps.meta.outputs.backend-image }}" \
            -t "${REGISTRY}/${IMAGE_NAMESPACE}/backend:latest" \
            ./advance-backend

          docker push "${{ steps.meta.outputs.backend-image }}"
          docker push "${REGISTRY}/${IMAGE_NAMESPACE}/backend:latest"

      - name: Build and push admin image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="" \
            -t "${{ steps.meta.outputs.admin-image }}" \
            -t "${REGISTRY}/${IMAGE_NAMESPACE}/admin:latest" \
            ./admin

          docker push "${{ steps.meta.outputs.admin-image }}"
          docker push "${REGISTRY}/${IMAGE_NAMESPACE}/admin:latest"

  deploy:
    name: deploy-vps
    runs-on: ubuntu-latest
    needs:
      - build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-push.outputs.image-tag }}

      - name: Validate deployment secrets
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test -n "${VPS_HOST}"
          test -n "${VPS_USER}"
          test -n "${VPS_PASSWORD}"
          test -n "${PRODUCTION_ENV_FILE}"

      - name: Install SSH password helper
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Prepare deployment files
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          install -m 700 -d .deploy
          cp docker-compose.yml .deploy/docker-compose.yml
          printf '%s' "${PRODUCTION_ENV_FILE}" > .deploy/.env.production.local
          chmod 600 .deploy/.env.production.local

      - name: Check VPS Docker runtime
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "command -v docker >/dev/null && docker compose version >/dev/null"

      - name: Upload Compose and env files
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p '${DEPLOY_DIR}' && chmod 700 '${DEPLOY_DIR}'"

          sshpass -e scp -o StrictHostKeyChecking=accept-new \
            .deploy/docker-compose.yml \
            .deploy/.env.production.local \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${DEPLOY_DIR}/"

      - name: Pull images and restart containers
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend-image }}
          ADMIN_IMAGE: ${{ needs.build-and-push.outputs.admin-image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | sshpass -e ssh -o StrictHostKeyChecking=accept-new "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "docker login '${REGISTRY}' -u '${{ github.actor }}' --password-stdin"

          sshpass -e ssh -o StrictHostKeyChecking=accept-new "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd '${DEPLOY_DIR}' && \
             DIVO_ENV_FILE=.env.production.local \
             DIVO_BACKEND_IMAGE='${BACKEND_IMAGE}' \
             DIVO_ADMIN_IMAGE='${ADMIN_IMAGE}' \
             docker compose --env-file .env.production.local pull divo-backend divo-admin && \
             DIVO_ENV_FILE=.env.production.local \
             DIVO_BACKEND_IMAGE='${BACKEND_IMAGE}' \
             DIVO_ADMIN_IMAGE='${ADMIN_IMAGE}' \
             docker compose --env-file .env.production.local up -d --no-build --remove-orphans"

      - name: Smoke test
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "DEPLOY_DIR='${DEPLOY_DIR}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "${DEPLOY_DIR}"

          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 http://127.0.0.1:3001/health >/dev/null \
              && curl -fsS --max-time 10 http://127.0.0.1:8081/ >/dev/null; then
              docker compose --env-file .env.production.local ps
              exit 0
            fi

            sleep 5
          done

          docker compose --env-file .env.production.local ps
          docker compose --env-file .env.production.local logs --tail=120 divo-backend divo-admin
          exit 1
          REMOTE
