name: Deploy main

on:
  workflow_dispatch:
    inputs:
      clone_development_database:
        description: Replace the main database with an exact logical copy of development
        required: true
        type: boolean
        default: false
      apply_schema:
        description: Apply the checked-in Prisma schema after the optional clone
        required: true
        type: boolean
        default: false
      retire_data_export_storage:
        description: One-time retirement of the removed dataExport queue and tables (backs up Main first)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: relicwavetechnologies/zoho-automation
  DEPLOY_DIR: /opt/divo-main
  DIVO_MAIN_DOMAIN: divo.outreachdeal.com
  DIVO_MAIN_APP_ORIGIN: https://divo.outreachdeal.com
  DIVO_MAIN_HOST: 103.172.92.187
  DIVO_MAIN_USER: deploy

jobs:
  main-guard:
    name: main-guard
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch
        run: test "${GITHUB_REF}" = refs/heads/main

      - name: Validate main public URLs
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          node <<'NODE'
          const values = new Map();
          for (const rawLine of (process.env.PRODUCTION_ENV_FILE ?? '').split(/\r?\n/)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const match = line.match(/^(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)=(.*)$/);
            if (!match) continue;
            let value = match[2].trim();
            if ((value.startsWith('"') && value.endsWith('"')) ||
                (value.startsWith("'") && value.endsWith("'"))) {
              value = value.slice(1, -1);
            }
            values.set(match[1], value);
          }

          const expectedAppOrigin = process.env.DIVO_MAIN_APP_ORIGIN;
          if (!expectedAppOrigin) {
            throw new Error('DIVO_MAIN_APP_ORIGIN must be configured for main deploys');
          }

          const expected = new URL(expectedAppOrigin);
          const deployDomain = process.env.DIVO_MAIN_DOMAIN;
          if (deployDomain !== expected.hostname) {
            throw new Error(
              `DIVO_MAIN_DOMAIN (${deployDomain}) must match DIVO_MAIN_APP_ORIGIN hostname (${expected.hostname})`,
            );
          }

          const originOf = value => {
            try {
              const url = new URL(value);
              return `${url.protocol}//${url.host}`;
            } catch {
              return null;
            }
          };

          const appBaseUrl = values.get('APP_BASE_URL');
          if (originOf(appBaseUrl) !== expectedAppOrigin) {
            throw new Error(
              `PRODUCTION_ENV_FILE APP_BASE_URL must be ${expectedAppOrigin}; got ${appBaseUrl || '<missing>'}`,
            );
          }

          const publicUrl = values.get('DIVO_PUBLIC_URL');
          if (publicUrl && originOf(publicUrl) !== expectedAppOrigin) {
            throw new Error(
              `PRODUCTION_ENV_FILE DIVO_PUBLIC_URL must be ${expectedAppOrigin}; got ${publicUrl}`,
            );
          }

          const allowlist = (values.get('BACKEND_PUBLIC_URL_ALLOWLIST') || '')
            .split(',')
            .map(value => value.trim())
            .filter(Boolean)
            .map(originOf)
            .filter(Boolean);
          if (!allowlist.includes(expectedAppOrigin)) {
            throw new Error(
              `PRODUCTION_ENV_FILE BACKEND_PUBLIC_URL_ALLOWLIST must include ${expectedAppOrigin}`,
            );
          }

          const runtimeUrl = values.get('PI_LARK_BACKEND_URL') || values.get('BACKEND_PUBLIC_URL');
          let parsed;
          try {
            parsed = new URL(runtimeUrl);
          } catch {
            throw new Error('PI_LARK_BACKEND_URL (or BACKEND_PUBLIC_URL) must be a valid URL');
          }

          const hostname = parsed.hostname.toLowerCase();
          const isolatedHost = !hostname.includes('.') && !hostname.includes(':');
          const localHost = hostname === 'localhost' || hostname === '127.0.0.1' ||
            hostname === '::1' || hostname === '[::1]' || hostname === '0.0.0.0' ||
            hostname.endsWith('.localhost') || hostname.endsWith('.local') || hostname.endsWith('.internal');
          if (parsed.protocol !== 'https:' || isolatedHost || localHost) {
            throw new Error(
              'PI_LARK_BACKEND_URL must be a public HTTPS URL reachable from isolated per-user Docker networks',
            );
          }
          NODE

  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    needs: main-guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./advance-backend
            file: ./advance-backend/Dockerfile
            checkout_path: advance-backend
            build-args: ""
          - component: admin
            context: ./admin
            file: ./admin/Dockerfile
            checkout_path: admin
            build-args: VITE_API_BASE_URL=
          - component: pi
            context: ./divo-pi
            file: ./divo-pi/Dockerfile
            checkout_path: divo-pi
            build-args: ""
          - component: pi-controller
            context: ./divo-pi
            file: ./divo-pi/Dockerfile.controller
            checkout_path: divo-pi
            build-args: ""
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          sparse-checkout: ${{ matrix.checkout_path }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component }} image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.component }}:main-${{ github.sha }}
          labels: com.divo.environment=main
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Record ${{ matrix.component }} release image
        run: |
          {
            echo "### Main image: ${{ matrix.component }}"
            echo "- Tag: \`main-${GITHUB_SHA}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Build cache and timing details are attached in the Docker build summary."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke published Pi image
        if: matrix.component == 'pi' || matrix.component == 'pi-controller'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "${IMAGE}"
          if [[ "${{ matrix.component }}" == "pi" ]]; then
            docker run --rm --network none --entrypoint npm "${IMAGE}" run divo:test
            docker run --rm --network none --tmpfs /data:rw,uid=10001,gid=10001 \
              --entrypoint /app/node_modules/.bin/tsx "${IMAGE}" \
              packages/coding-agent/src/cli.ts --version
          else
            name="divo-controller-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            prefix="divo-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            trap 'docker rm -f "${name}" >/dev/null 2>&1 || true' EXIT
            docker run -d --name "${name}" --network none \
              -e DIVO_PI_RESOURCE_PREFIX="${prefix}" \
              -v /var/run/docker.sock:/var/run/docker.sock "${IMAGE}"
            for attempt in $(seq 1 20); do
              if docker exec "${name}" node -e \
                "fetch('http://127.0.0.1:4317/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                exit 0
              fi
              [[ "$(docker inspect --format '{{.State.Running}}' "${name}")" == true ]] || break
              sleep 0.25
            done
            docker logs "${name}"
            exit 1
          fi

      - name: Promote ${{ matrix.component }} main alias
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}
          LATEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.component }}:main-latest
        run: docker buildx imagetools create --tag "${LATEST}" "${IMAGE}"

  deploy:
    name: deploy-main-vps
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /docker-compose.yml
            /infra/production/nginx/
          sparse-checkout-cone-mode: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve main images by digest
        env:
          IMAGE_PREFIX: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}
          RELEASE_TAG: main-${{ github.sha }}
        run: |
          resolve() {
            local component="$1" variable="$2" image digest
            image="${IMAGE_PREFIX}/${component}:${RELEASE_TAG}"
            digest="$(docker buildx imagetools inspect "${image}" --format '{{.Manifest.Digest}}')"
            test -n "${digest}"
            printf '%s=%s@%s\n' "${variable}" "${IMAGE_PREFIX}/${component}" "${digest}" >> "${GITHUB_ENV}"
          }
          resolve backend BACKEND_IMAGE
          resolve admin ADMIN_IMAGE
          resolve pi PI_IMAGE
          resolve pi-controller PI_CONTROLLER_IMAGE

      - name: Start deployment timer
        run: echo "DEPLOY_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          DIVO_MAIN_SSH_KEY: ${{ secrets.DIVO_DEV_SSH_KEY }}
        run: |
          test -n "${DIVO_MAIN_SSH_KEY}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DIVO_MAIN_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '103.172.92.187 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICer9x9ARy2oBqzIGOALmDDLZPwpIfEmbXuutFu53Nuy' >> ~/.ssh/known_hosts

      - name: Provision main directory, environment, and HTTPS
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test -n "${PRODUCTION_ENV_FILE}"
          test -n "${VPS_PASSWORD}"
          test -n "${VPS_USER}"
          sudo apt-get update
          sudo apt-get install -y sshpass

          printf '%s' "${PRODUCTION_ENV_FILE}" | SSHPASS="${VPS_PASSWORD}" sshpass -e \
            ssh -o StrictHostKeyChecking=yes "${VPS_USER}@${DIVO_MAIN_HOST}" \
            "test \"\$(id -u)\" = 0 && install -d -m 700 -o deploy -g deploy '${DEPLOY_DIR}' && if test -s '${DEPLOY_DIR}/.env.production.local'; then cp -p '${DEPLOY_DIR}/.env.production.local' '${DEPLOY_DIR}/.release-rollback.env.production.local'; fi && cat > '${DEPLOY_DIR}/.env.production.local' && chown deploy:deploy '${DEPLOY_DIR}/.env.production.local' && chmod 600 '${DEPLOY_DIR}/.env.production.local'"

          SSHPASS="${VPS_PASSWORD}" sshpass -e scp -o StrictHostKeyChecking=yes \
            infra/production/nginx/app.http.conf \
            infra/production/nginx/app.conf \
            "${VPS_USER}@${DIVO_MAIN_HOST}:/tmp/"

          SSHPASS="${VPS_PASSWORD}" sshpass -e ssh -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${DIVO_MAIN_HOST}" "DIVO_MAIN_DOMAIN='${DIVO_MAIN_DOMAIN}' bash -s" <<'ROOT'
          set -euo pipefail
          install -d -m 755 /var/www/certbot
          install -m 644 /tmp/app.http.conf /etc/nginx/sites-available/divo-main.conf
          ln -sfn /etc/nginx/sites-available/divo-main.conf /etc/nginx/sites-enabled/divo-main.conf
          nginx -t
          systemctl reload nginx

          if [[ ! -s "/etc/letsencrypt/live/${DIVO_MAIN_DOMAIN}/fullchain.pem" ]]; then
            certbot certonly --webroot -w /var/www/certbot \
              -d "${DIVO_MAIN_DOMAIN}" --non-interactive --agree-tos \
              --register-unsafely-without-email
          fi

          install -m 644 /tmp/app.conf /etc/nginx/sites-available/divo-main.conf
          rm -f /tmp/app.http.conf /tmp/app.conf
          nginx -t
          systemctl reload nginx
          ROOT

      - name: Verify main environment is provisioned
        run: |
          ssh -i ~/.ssh/id_ed25519 "${DIVO_MAIN_USER}@${DIVO_MAIN_HOST}" \
            "test -r '${DEPLOY_DIR}/.env.production.local' && command -v docker >/dev/null && docker compose version >/dev/null"

      - name: Upload main configuration
        run: |
          ssh -i ~/.ssh/id_ed25519 "${DIVO_MAIN_USER}@${DIVO_MAIN_HOST}" \
            "install -d -m 700 '${DEPLOY_DIR}' && if test -s '${DEPLOY_DIR}/docker-compose.yml'; then cp -p '${DEPLOY_DIR}/docker-compose.yml' '${DEPLOY_DIR}/.release-rollback.docker-compose.yml'; fi"
          scp -i ~/.ssh/id_ed25519 docker-compose.yml \
            "${DIVO_MAIN_USER}@${DIVO_MAIN_HOST}:${DEPLOY_DIR}/docker-compose.yml"

      - name: Pull images, optionally clone data, and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLONE_DEVELOPMENT_DATABASE: ${{ inputs.clone_development_database }}
          APPLY_SCHEMA: ${{ inputs.apply_schema }}
          RETIRE_DATA_EXPORT_STORAGE: ${{ inputs.retire_data_export_storage }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | ssh -i ~/.ssh/id_ed25519 "${DIVO_MAIN_USER}@${DIVO_MAIN_HOST}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

          ssh -i ~/.ssh/id_ed25519 "${DIVO_MAIN_USER}@${DIVO_MAIN_HOST}" \
            "DEPLOY_DIR='${DEPLOY_DIR}' BACKEND_IMAGE='${BACKEND_IMAGE}' ADMIN_IMAGE='${ADMIN_IMAGE}' PI_IMAGE='${PI_IMAGE}' PI_CONTROLLER_IMAGE='${PI_CONTROLLER_IMAGE}' CLONE_DEVELOPMENT_DATABASE='${CLONE_DEVELOPMENT_DATABASE}' APPLY_SCHEMA='${APPLY_SCHEMA}' RETIRE_DATA_EXPORT_STORAGE='${RETIRE_DATA_EXPORT_STORAGE}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "${DEPLOY_DIR}"
          export DIVO_ENV_FILE=.env.production.local
          rm -f .release-data-export-retirement-backup

          if curl -fsS --max-time 10 http://127.0.0.1:13002/health >/dev/null; then
            backend_image="$(docker inspect --format='{{.Config.Image}}' divo-main-divo-backend-1)"
            admin_image="$(docker inspect --format='{{.Config.Image}}' divo-main-divo-admin-1)"
            pi_image="$(docker inspect --format='{{range .Config.Env}}{{println .}}{{end}}' divo-main-divo-pi-controller-1 | sed -n 's/^DIVO_PI_IMAGE=//p')"
            pi_controller_image="$(docker inspect --format='{{.Config.Image}}' divo-main-divo-pi-controller-1)"

            if [[ -n "${backend_image}" && -n "${admin_image}" && -n "${pi_image}" && -n "${pi_controller_image}" ]]; then
              umask 077
              {
                printf 'DIVO_BACKEND_IMAGE=%q\n' "${backend_image}"
                printf 'DIVO_ADMIN_IMAGE=%q\n' "${admin_image}"
                printf 'DIVO_PI_IMAGE=%q\n' "${pi_image}"
                printf 'DIVO_PI_CONTROLLER_IMAGE=%q\n' "${pi_controller_image}"
              } > .release-rollback.images.env
            fi
          else
            echo "Current release is not healthy; preserving the existing rollback image snapshot."
          fi

          export DIVO_BACKEND_IMAGE="${BACKEND_IMAGE}"
          export DIVO_ADMIN_IMAGE="${ADMIN_IMAGE}"
          export DIVO_PI_IMAGE="${PI_IMAGE}"
          export DIVO_PI_CONTROLLER_IMAGE="${PI_CONTROLLER_IMAGE}"

          docker compose --env-file .env.production.local pull
          docker pull "${DIVO_PI_IMAGE}"
          docker compose --env-file .env.production.local up -d --wait \
            divo-postgres divo-redis-queue divo-redis-cache divo-redis-memory

          if [[ "${RETIRE_DATA_EXPORT_STORAGE}" == "true" ]]; then
            test "${APPLY_SCHEMA}" = "true"
            test "${CLONE_DEVELOPMENT_DATABASE}" = "false"
            docker compose --env-file .env.production.local stop divo-backend >/dev/null 2>&1 || true
            install -d -m 700 backups
            retirement_backup="backups/data-export-retirement-$(date -u +%Y%m%dT%H%M%SZ).dump"
            docker exec divo-main-divo-postgres-1 sh -lc \
              'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "${retirement_backup}"
            test -s "${retirement_backup}"
            chmod 600 "${retirement_backup}"
            printf '%s\n' "${retirement_backup}" > .release-data-export-retirement-backup
            chmod 600 .release-data-export-retirement-backup
            docker compose --env-file .env.production.local run --rm --no-deps \
              -e DATA_EXPORT_RETIRE_CONFIRM=delete-retired-data-export-storage \
              divo-backend pnpm retire:data-export -- --apply </dev/null
          fi

          if [[ "${CLONE_DEVELOPMENT_DATABASE}" == "true" ]]; then
            dev_db_container=divo-development-divo-dev-postgres-1
            main_db_container=divo-main-divo-postgres-1
            dump_file="$(mktemp "${DEPLOY_DIR}/dev-database.XXXXXX.dump")"
            chmod 600 "${dump_file}"
            trap 'rm -f "${dump_file}"' EXIT

            docker inspect "${dev_db_container}" >/dev/null
            docker compose --env-file .env.production.local stop divo-backend >/dev/null 2>&1 || true
            docker exec "${dev_db_container}" sh -lc \
              'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "${dump_file}"
            test -s "${dump_file}"

            docker exec "${main_db_container}" sh -lc \
              'dropdb --if-exists --force -U "$POSTGRES_USER" "$POSTGRES_DB" && createdb -U "$POSTGRES_USER" "$POSTGRES_DB"'
            docker exec -i "${main_db_container}" sh -lc \
              'pg_restore -U "$POSTGRES_USER" -d "$POSTGRES_DB" --no-owner --no-acl' < "${dump_file}"

            dev_tables="$(docker exec "${dev_db_container}" sh -lc \
              'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "select count(*) from information_schema.tables where table_schema = '\''public'\'' and table_type = '\''BASE TABLE'\''"')"
            main_tables="$(docker exec "${main_db_container}" sh -lc \
              'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "select count(*) from information_schema.tables where table_schema = '\''public'\'' and table_type = '\''BASE TABLE'\''"')"
            test "${dev_tables}" = "${main_tables}"
            rm -f "${dump_file}"
            trap - EXIT
          fi

          if [[ "${APPLY_SCHEMA}" == "true" ]]; then
            docker compose --env-file .env.production.local run --rm --no-deps \
              divo-backend pnpm prisma db push --skip-generate </dev/null
            docker compose --env-file .env.production.local run --rm --no-deps \
              divo-backend pnpm tsx scripts/seed-registered-tools.ts </dev/null
            docker compose --env-file .env.production.local run --rm --no-deps \
              divo-backend pnpm provision:google-workspace-skills </dev/null
          fi

          docker compose --env-file .env.production.local up -d --no-build --remove-orphans
          docker compose --env-file .env.production.local up -d --wait --no-build \
            --force-recreate --no-deps divo-pi-controller divo-backend divo-admin
          REMOTE

      - name: Smoke test main
        run: |
          ssh -i ~/.ssh/id_ed25519 "${DIVO_MAIN_USER}@${DIVO_MAIN_HOST}" \
            "DIVO_MAIN_DOMAIN='${DIVO_MAIN_DOMAIN}' DEPLOY_DIR='${DEPLOY_DIR}' DIVO_BACKEND_IMAGE='${BACKEND_IMAGE}' DIVO_ADMIN_IMAGE='${ADMIN_IMAGE}' DIVO_PI_IMAGE='${PI_IMAGE}' DIVO_PI_CONTROLLER_IMAGE='${PI_CONTROLLER_IMAGE}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "${DEPLOY_DIR}"
          export DIVO_ENV_FILE=.env.production.local

          for attempt in $(seq 1 30); do
            if test "$(docker inspect --format='{{.Config.Image}}' divo-main-divo-backend-1)" = "${DIVO_BACKEND_IMAGE}" \
              && test "$(docker inspect --format='{{.Config.Image}}' divo-main-divo-admin-1)" = "${DIVO_ADMIN_IMAGE}" \
              && test "$(docker inspect --format='{{.Config.Image}}' divo-main-divo-pi-controller-1)" = "${DIVO_PI_CONTROLLER_IMAGE}" \
              && test "$(docker inspect --format='{{range .Config.Env}}{{println .}}{{end}}' divo-main-divo-pi-controller-1 | sed -n 's/^DIVO_PI_IMAGE=//p')" = "${DIVO_PI_IMAGE}" \
              && curl -fsS --max-time 10 http://127.0.0.1:13002/health >/dev/null \
              && curl -fsS --max-time 10 http://127.0.0.1:18082/ >/dev/null \
              && curl -fsS --max-time 15 --resolve "${DIVO_MAIN_DOMAIN}:443:127.0.0.1" "https://${DIVO_MAIN_DOMAIN}/" >/dev/null \
              && DIVO_BACKEND_IMAGE="${DIVO_BACKEND_IMAGE}" \
                 DIVO_ADMIN_IMAGE="${DIVO_ADMIN_IMAGE}" \
                 DIVO_PI_IMAGE="${DIVO_PI_IMAGE}" \
                 DIVO_PI_CONTROLLER_IMAGE="${DIVO_PI_CONTROLLER_IMAGE}" \
                 docker compose --env-file .env.production.local exec -T divo-backend \
                 node -e "fetch('http://divo-pi-controller:4317/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              rm -f .release-data-export-retirement-backup
              docker compose --env-file .env.production.local ps
              exit 0
            fi
            sleep 5
          done

          docker compose --env-file .env.production.local ps
          docker compose --env-file .env.production.local logs --tail=160 \
            divo-backend divo-admin google-workspace-mcp divo-pi-controller
          exit 1
          REMOTE

      - name: Roll back main release after failure
        if: ${{ failure() }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${DIVO_MAIN_USER}@${DIVO_MAIN_HOST}" \
            "DEPLOY_DIR='${DEPLOY_DIR}' DIVO_MAIN_DOMAIN='${DIVO_MAIN_DOMAIN}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "${DEPLOY_DIR}"
          test -s .release-rollback.images.env
          test -s .release-rollback.docker-compose.yml
          test -s .release-rollback.env.production.local

          cp -p .release-rollback.docker-compose.yml docker-compose.yml
          cp -p .release-rollback.env.production.local .env.production.local
          # This file is written only by the deployment step above from docker inspect output.
          source .release-rollback.images.env
          export DIVO_ENV_FILE=.env.production.local
          export DIVO_BACKEND_IMAGE DIVO_ADMIN_IMAGE DIVO_PI_IMAGE DIVO_PI_CONTROLLER_IMAGE

          if [[ -s .release-data-export-retirement-backup ]]; then
            retirement_backup="$(cat .release-data-export-retirement-backup)"
            case "${retirement_backup}" in
              backups/data-export-retirement-*.dump) ;;
              *) echo "Invalid retirement backup path" >&2; exit 1 ;;
            esac
            test -s "${retirement_backup}"
            docker compose --env-file .env.production.local stop divo-backend >/dev/null 2>&1 || true
            docker exec divo-main-divo-postgres-1 sh -lc \
              'dropdb --if-exists --force -U "$POSTGRES_USER" "$POSTGRES_DB" && createdb -U "$POSTGRES_USER" "$POSTGRES_DB"'
            docker exec -i divo-main-divo-postgres-1 sh -lc \
              'pg_restore -U "$POSTGRES_USER" -d "$POSTGRES_DB" --no-owner --no-acl' < "${retirement_backup}"
            rm -f .release-data-export-retirement-backup
          fi

          docker compose --env-file .env.production.local up -d --no-build --remove-orphans

          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 http://127.0.0.1:13002/health >/dev/null \
              && curl -fsS --max-time 10 http://127.0.0.1:18082/ >/dev/null \
              && curl -fsS --max-time 15 --resolve "${DIVO_MAIN_DOMAIN}:443:127.0.0.1" "https://${DIVO_MAIN_DOMAIN}/" >/dev/null \
              && docker compose --env-file .env.production.local exec -T divo-backend \
                 node -e "fetch('http://divo-pi-controller:4317/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              echo "Rollback succeeded. The rejected release remains failed in CI."
              docker compose --env-file .env.production.local ps
              exit 0
            fi
            sleep 5
          done

          echo "Rollback did not restore a healthy release."
          docker compose --env-file .env.production.local ps
          docker compose --env-file .env.production.local logs --tail=160 \
            divo-backend divo-admin google-workspace-mcp divo-pi-controller
          exit 1
          REMOTE

      - name: Record deployment duration
        if: ${{ always() }}
        run: |
          elapsed=$(( $(date +%s) - DEPLOY_STARTED_AT ))
          {
            echo "### Main deployment"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Duration: $((elapsed / 60))m $((elapsed % 60))s"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
