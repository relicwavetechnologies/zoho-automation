server {
  listen 80;
  listen [::]:80;
  server_name divo.outreachdeal.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name divo.outreachdeal.com;

  ssl_certificate /etc/letsencrypt/live/divo.outreachdeal.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/divo.outreachdeal.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  server_tokens off;
  client_max_body_size 32m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  include /etc/nginx/snippets/divo-desktop-updates.conf;

  location ^~ /api/desktop/teach/ {
    proxy_pass http://127.0.0.1:13002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2048m;
    proxy_request_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
  }

  # A conversation's video, streamed. Same treatment as the Teach upload above,
  # and for the same reason: the default 32m ceiling refuses an ordinary screen
  # recording, and request buffering would hold the whole file at the proxy
  # before the backend saw a byte -- which is precisely the head start that lets
  # Divo begin watching while the question is still being typed.
  location ^~ /api/web-chat/threads/ {
    proxy_pass http://127.0.0.1:13002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2048m;
    proxy_request_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:13002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /webhooks/ {
    proxy_pass http://127.0.0.1:13002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location / {
    proxy_pass http://127.0.0.1:18082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
