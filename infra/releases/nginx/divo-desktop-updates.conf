# Include this file inside the HTTPS server block for
# app-dev.103.172.92.187.sslip.io. The release publisher writes versioned files
# to /srv/divo-releases; Nginx only needs read access.

location = /desktop-updates/stable/latest.json {
  alias /srv/divo-releases/stable/latest.json;
  default_type application/json;
  add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  add_header X-Content-Type-Options nosniff always;
}

location = /desktop-updates/dev/latest.json {
  alias /srv/divo-releases/dev/latest.json;
  default_type application/json;
  add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  add_header X-Content-Type-Options nosniff always;
}

location ^~ /desktop-updates/ {
  alias /srv/divo-releases/;
  autoindex off;
  default_type application/octet-stream;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  add_header X-Content-Type-Options nosniff always;
}
