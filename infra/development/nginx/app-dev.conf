server {
  listen 80;
  listen [::]:80;
  server_name app-dev.103.172.92.187.sslip.io;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name app-dev.103.172.92.187.sslip.io;

  ssl_certificate /etc/letsencrypt/live/app-dev.103.172.92.187.sslip.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app-dev.103.172.92.187.sslip.io/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  server_tokens off;
  client_max_body_size 32m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass http://127.0.0.1:13001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location / {
    proxy_pass http://127.0.0.1:18081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
