server {
  listen 80;
  listen [::]:80;
  server_name app-dev.103.172.92.187.sslip.io;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name app-dev.103.172.92.187.sslip.io;

  ssl_certificate /etc/letsencrypt/live/app-dev.103.172.92.187.sslip.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app-dev.103.172.92.187.sslip.io/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  server_tokens off;
  client_max_body_size 32m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  include /etc/nginx/snippets/divo-desktop-updates.conf;

  # Teach uploads are whole screen recordings, not API payloads. The 32m cap
  # above is right for every other endpoint and 64x too small here: nginx
  # answered 413 before the request ever reached Express, and the desktop
  # reported it as "This recording is too large to send. A shorter one will
  # work." — so the limit looked like a product rule rather than a proxy one.
  #
  # The backend is what actually enforces the ceiling
  # (MANAGER_TEACH_MAX_VIDEO_MB, default 2047). nginx only has to stop being
  # the smaller of the two, so keep this at or above that value.
  location ^~ /api/desktop/teach/ {
    proxy_pass http://127.0.0.1:13001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 2048m;
    # Hand the body straight to the backend. Buffering would spool the whole
    # recording into a proxy temp file first, which defeats the backend's
    # deliberate stream-to-disk upload path and delays every byte.
    proxy_request_buffering off;
    # A long recording on slow wifi outlasts the 300s the API block allows.
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:13001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Channel ingress lives outside /api/ — the backend mounts it at /webhooks/lark
  # and Lark posts the URL-verification challenge there. Without this block the
  # catch-all below hands the request to the admin SPA, which answers a POST with
  # a 405 HTML page, and Lark rejects it as "Response data is not valid JSON".
  location /webhooks/ {
    proxy_pass http://127.0.0.1:13001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location / {
    proxy_pass http://127.0.0.1:18081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
