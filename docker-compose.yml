name: divo-main

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  divo-postgres:
    image: postgres:16-alpine
    env_file:
      - ${DIVO_ENV_FILE:-/dev/null}
    environment:
      POSTGRES_DB: ${DIVO_POSTGRES_DB:-divo_main}
      POSTGRES_USER: ${DIVO_POSTGRES_USER:-divo_main_app}
      POSTGRES_PASSWORD: ${DIVO_POSTGRES_PASSWORD:?DIVO_POSTGRES_PASSWORD is required}
    volumes:
      - divo_main_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DIVO_POSTGRES_PORT:-15434}:5432"
    restart: unless-stopped
    networks:
      - divo-main-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  divo-backend:
    image: ${DIVO_BACKEND_IMAGE:?DIVO_BACKEND_IMAGE is required}
    env_file:
      - ${DIVO_ENV_FILE:-/dev/null}
    environment:
      NODE_ENV: production
      PORT: 3001
      # Both default to DIVO_PUBLIC_URL, so a deployment that sets neither
      # behaves exactly as it always has. They can differ because a deployment
      # can answer to more than one hostname — a real domain and the bare-IP
      # name it was stood up on — and the two names are not interchangeable:
      #
      #   APP_BASE_URL       what people browse. Sessions live in localStorage,
      #                      which is partitioned per origin, so every link Divo
      #                      sends must name the origin its own sign-in uses or
      #                      the recipient lands on a login page.
      #   BACKEND_PUBLIC_URL where OAuth comes back to. This one is registered
      #                      with Google, Lark, Zoho and Shopify, so it can only
      #                      move once those consoles have the new value.
      #
      # Forcing them equal meant adopting a domain required re-registering six
      # integrations on the same day, so the domain never got adopted.
      APP_BASE_URL: ${APP_BASE_URL:-${DIVO_PUBLIC_URL:?DIVO_PUBLIC_URL is required}}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-${DIVO_PUBLIC_URL:?DIVO_PUBLIC_URL is required}}
      REDIS_URL: redis://divo-redis-cache:6379/0
      REDIS_QUEUE_URL: redis://divo-redis-queue:6379/0
      REDIS_CACHE_URL: redis://divo-redis-cache:6379/0
      REDIS_MEMORY_URL: redis://divo-redis-memory:6379/0
      GOOGLE_WORKSPACE_MCP_URL: http://google-workspace-mcp:8000/mcp
      # The Docker socket is isolated in the private controller service; it is
      # never mounted into the public backend container.
      PI_LARK_CONTROLLER_URL: http://divo-pi-controller:4317
      PI_LARK_RUNTIME_INSTANCE_ID: ${PI_LARK_RUNTIME_INSTANCE_ID:-pi-main-1}
      DIVO_AUTONOMOUS_WORKERS_ENABLED: ${DIVO_AUTONOMOUS_WORKERS_ENABLED:-false}
      HINDSIGHT_ENABLED: "true"
      HINDSIGHT_URL: http://divo-hindsight:8888
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:?HINDSIGHT_API_KEY is required}
      KNOWLEDGE_FILE_MALWARE_SCAN_MODE: required
      CLAMAV_HOST: divo-clamav
      CLAMAV_PORT: 3310
    depends_on:
      divo-schema-sync:
        condition: service_completed_successfully
      divo-postgres:
        condition: service_healthy
      divo-redis-queue:
        condition: service_healthy
      divo-redis-cache:
        condition: service_healthy
      divo-redis-memory:
        condition: service_healthy
      google-workspace-mcp:
        condition: service_healthy
      divo-hindsight:
        condition: service_healthy
      divo-clamav:
        condition: service_healthy
      divo-pi-controller:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DIVO_BACKEND_PORT:-13002}:3001"
    restart: unless-stopped
    # Media the backend holds while it works on it: Teach recordings and the
    # videos attached to ordinary chats, both of which are gigabyte-scale and
    # short-lived. On a named volume rather than the container's writable layer,
    # because that layer shares a filesystem with Postgres, Redis and every
    # other container on the host — a member uploading recordings faster than
    # they are read would otherwise take the database down with it. Survives a
    # redeploy too, so an upload in flight during one is not silently lost.
    volumes:
      - divo_main_backend_media:/app/.data
    networks:
      - divo-main-internal
      - divo-main-agent-control
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5

  # One release gate synchronizes Prisma's declared schema before app replicas
  # start. This deployment lineage is managed with Prisma db push.
  divo-schema-sync:
    image: ${DIVO_BACKEND_IMAGE:?DIVO_BACKEND_IMAGE is required}
    env_file:
      - ${DIVO_ENV_FILE:-/dev/null}
    command: ["pnpm", "schema:sync"]
    depends_on:
      divo-postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - divo-main-internal
    logging: *default-logging

  divo-hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.8.6
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:${HINDSIGHT_DB_PASSWORD:?HINDSIGHT_DB_PASSWORD is required}@divo-hindsight-postgres:5432/hindsight
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_LLM_PROVIDER:-openai}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:-gpt-4o-mini}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_LLM_API_KEY:?HINDSIGHT_LLM_API_KEY is required}
      HINDSIGHT_API_RERANKER_PROVIDER: rrf
      HINDSIGHT_API_WORKER_ID: divo-production-1
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_API_KEY:?HINDSIGHT_API_KEY is required}
      HINDSIGHT_API_ENABLE_BANK_CONFIG_API: "false"
      HINDSIGHT_API_DEFAULT_BANK_TEMPLATE: '{"version":"1","bank":{"retain_strategies":{"exact":{"retain_extraction_mode":"verbatim","enable_observations":false}}}}'
    depends_on:
      divo-hindsight-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - divo-main-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 8

  divo-clamav:
    image: clamav/clamav:1.5.3
    volumes:
      - divo_main_clamav_signatures:/var/lib/clamav
    restart: unless-stopped
    networks:
      - divo-main-internal
    logging: *default-logging

  divo-hindsight-postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: hindsight
      POSTGRES_USER: hindsight
      POSTGRES_PASSWORD: ${HINDSIGHT_DB_PASSWORD:?HINDSIGHT_DB_PASSWORD is required}
    volumes:
      - divo_main_hindsight_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - divo-main-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hindsight -d hindsight"]
      interval: 10s
      timeout: 5s
      retries: 8

  divo-pi-controller:
    image: ${DIVO_PI_CONTROLLER_IMAGE:?DIVO_PI_CONTROLLER_IMAGE is required}
    user: "0:0"
    environment:
      DIVO_CONTROLLER_HOST: 0.0.0.0
      DIVO_CONTROLLER_PORT: 4317
      DIVO_PI_IMAGE: ${DIVO_PI_IMAGE:?DIVO_PI_IMAGE is required}
      DIVO_PI_RESOURCE_PREFIX: divo-pi-main
      DIVO_PI_ADD_HOST_GATEWAY: "false"
      DIVO_DEEPSEEK_TOOL_SURFACE: ${DIVO_DEEPSEEK_TOOL_SURFACE:-off}
      HOME: /tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - divo-main-agent-control
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4317/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  google-workspace-mcp:
    image: ghcr.io/taylorwilsdon/google_workspace_mcp:1.22.2
    env_file:
      - ${DIVO_ENV_FILE:-/dev/null}
    environment:
      MCP_ENABLE_OAUTH21: "true"
      EXTERNAL_OAUTH21_PROVIDER: "true"
      WORKSPACE_MCP_STATELESS_MODE: "true"
      WORKSPACE_MCP_TOOL_TIER: complete
      WORKSPACE_MCP_TOOLS: gmail,drive,calendar,docs,sheets,slides,forms,tasks,contacts,chat,appscript
      TOOL_TIER: complete
      TOOLS: gmail drive calendar docs sheets slides forms tasks contacts chat appscript
      ALLOWED_FILE_DIRS: /tmp/divo-no-local-files
    restart: unless-stopped
    networks:
      - divo-main-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  divo-admin:
    image: ${DIVO_ADMIN_IMAGE:?DIVO_ADMIN_IMAGE is required}
    environment:
      # Pass only the browser-safe key; never expose the backend's env file to nginx.
      LOGO_DEV_PUBLISHABLE_KEY: ${LOGO_DEV_PUBLISHABLE_KEY:-}
    depends_on:
      divo-backend:
        condition: service_started
    ports:
      - "127.0.0.1:${DIVO_ADMIN_PORT:-18082}:80"
    restart: unless-stopped
    networks:
      - divo-main-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  divo-redis-queue:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - divo_main_redis_queue_data:/data
    restart: unless-stopped
    networks:
      - divo-main-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  divo-redis-cache:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "300", "10"]
    volumes:
      - divo_main_redis_cache_data:/data
    restart: unless-stopped
    networks:
      - divo-main-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  divo-redis-memory:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "300", "10"]
    volumes:
      - divo_main_redis_memory_data:/data
    restart: unless-stopped
    networks:
      - divo-main-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  divo-main-internal:
    driver: bridge
  divo-main-agent-control:
    driver: bridge

volumes:
  divo_main_backend_media:
  divo_main_postgres_data:
  divo_main_redis_queue_data:
  divo_main_redis_cache_data:
  divo_main_redis_memory_data:
  divo_main_hindsight_postgres_data:
  divo_main_clamav_signatures:
