name: divo

services:
  divo-backend:
    image: ${DIVO_BACKEND_IMAGE:-divo-backend:local}
    build:
      context: ./advance-backend
      dockerfile: Dockerfile
    env_file:
      - ${DIVO_ENV_FILE:-/dev/null}
    environment:
      NODE_ENV: production
      PORT: 3001
      REDIS_URL: redis://divo-redis-cache:6379/0
      REDIS_QUEUE_URL: redis://divo-redis-queue:6379/0
      REDIS_CACHE_URL: redis://divo-redis-cache:6379/0
      REDIS_MEMORY_URL: redis://divo-redis-memory:6379/0
      GOOGLE_WORKSPACE_MCP_URL: http://google-workspace-mcp:8000/mcp
      # The production controller is a separately isolated private service.
      # Never mount the host Docker socket into the public backend container.
      PI_LARK_CONTROLLER_URL: ${PI_LARK_CONTROLLER_URL:?Private Pi controller URL is required}
      PI_LARK_RUNTIME_INSTANCE_ID: ${PI_LARK_RUNTIME_INSTANCE_ID:-pi-production-1}
      HINDSIGHT_ENABLED: "true"
      HINDSIGHT_URL: http://divo-hindsight:8888
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:?HINDSIGHT_API_KEY is required}
      KNOWLEDGE_FILE_MALWARE_SCAN_MODE: required
      CLAMAV_HOST: divo-clamav
      CLAMAV_PORT: 3310
    depends_on:
      divo-migrate:
        condition: service_completed_successfully
      divo-redis-queue:
        condition: service_healthy
      divo-redis-cache:
        condition: service_healthy
      divo-redis-memory:
        condition: service_healthy
      google-workspace-mcp:
        condition: service_healthy
      divo-hindsight:
        condition: service_healthy
      divo-clamav:
        condition: service_healthy
    ports:
      - "${DIVO_BACKEND_PORT:-3001}:3001"
    restart: unless-stopped
    networks:
      - divo-internal
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5

  # One release gate owns schema migration. App replicas never race ad-hoc
  # db-push operations, and they cannot start against an unversioned schema.
  divo-migrate:
    image: ${DIVO_BACKEND_IMAGE:-divo-backend:local}
    env_file:
      - ${DIVO_ENV_FILE:-/dev/null}
    command: ["pnpm", "prisma:migrate:deploy"]
    restart: "no"
    networks:
      - divo-internal

  divo-hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.8.6
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:${HINDSIGHT_DB_PASSWORD:?HINDSIGHT_DB_PASSWORD is required}@divo-hindsight-postgres:5432/hindsight
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_LLM_PROVIDER:-openai}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:-gpt-4o-mini}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_LLM_API_KEY:?HINDSIGHT_LLM_API_KEY is required}
      HINDSIGHT_API_RERANKER_PROVIDER: rrf
      HINDSIGHT_API_WORKER_ID: divo-production-1
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_API_KEY:?HINDSIGHT_API_KEY is required}
      HINDSIGHT_API_ENABLE_BANK_CONFIG_API: "false"
      HINDSIGHT_API_DEFAULT_BANK_TEMPLATE: '{"version":"1","bank":{"retain_strategies":{"exact":{"retain_extraction_mode":"verbatim","enable_observations":false}}}}'
    depends_on:
      divo-hindsight-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - divo-internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 8

  divo-clamav:
    image: clamav/clamav:1.5.3
    volumes:
      - divo_clamav_signatures:/var/lib/clamav
    restart: unless-stopped
    networks:
      - divo-internal

  divo-hindsight-postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: hindsight
      POSTGRES_USER: hindsight
      POSTGRES_PASSWORD: ${HINDSIGHT_DB_PASSWORD:?HINDSIGHT_DB_PASSWORD is required}
    volumes:
      - divo_hindsight_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - divo-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hindsight -d hindsight"]
      interval: 10s
      timeout: 5s
      retries: 8

  google-workspace-mcp:
    image: ghcr.io/taylorwilsdon/google_workspace_mcp:1.22.0
    env_file:
      - ${DIVO_ENV_FILE:-/dev/null}
    environment:
      MCP_ENABLE_OAUTH21: "true"
      EXTERNAL_OAUTH21_PROVIDER: "true"
      WORKSPACE_MCP_STATELESS_MODE: "true"
      WORKSPACE_MCP_TOOL_TIER: complete
      WORKSPACE_MCP_TOOLS: gmail,drive,calendar,docs,sheets,slides,forms,tasks,contacts,chat,appscript
      TOOL_TIER: complete
      TOOLS: gmail drive calendar docs sheets slides forms tasks contacts chat appscript
      ALLOWED_FILE_DIRS: /tmp/divo-no-local-files
    ports:
      - "127.0.0.1:${GOOGLE_WORKSPACE_MCP_PORT:-18000}:8000"
    restart: unless-stopped
    networks:
      - divo-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  divo-admin:
    image: ${DIVO_ADMIN_IMAGE:-divo-admin:local}
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      divo-backend:
        condition: service_started
    ports:
      - "${DIVO_ADMIN_PORT:-8081}:80"
    restart: unless-stopped
    networks:
      - divo-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  divo-redis-queue:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - divo_redis_queue_data:/data
    restart: unless-stopped
    networks:
      - divo-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  divo-redis-cache:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "300", "10"]
    volumes:
      - divo_redis_cache_data:/data
    restart: unless-stopped
    networks:
      - divo-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  divo-redis-memory:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "300", "10"]
    volumes:
      - divo_redis_memory_data:/data
    restart: unless-stopped
    networks:
      - divo-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  divo-internal:
    driver: bridge

volumes:
  divo_redis_queue_data:
  divo_redis_cache_data:
  divo_redis_memory_data:
  divo_hindsight_postgres_data:
  divo_clamav_signatures:
