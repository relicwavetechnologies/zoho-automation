name: divo-main

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

services:
  divo-postgres:
    image: postgres:16-alpine
    env_file:
      - ${DIVO_ENV_FILE:-/dev/null}
    environment:
      POSTGRES_DB: ${DIVO_POSTGRES_DB:-divo_main}
      POSTGRES_USER: ${DIVO_POSTGRES_USER:-divo_main_app}
      POSTGRES_PASSWORD: ${DIVO_POSTGRES_PASSWORD:?DIVO_POSTGRES_PASSWORD is required}
    volumes:
      - divo_main_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DIVO_POSTGRES_PORT:-15434}:5432"
    restart: unless-stopped
    networks:
      - divo-main-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  divo-backend:
    image: ${DIVO_BACKEND_IMAGE:?DIVO_BACKEND_IMAGE is required}
    env_file:
      - ${DIVO_ENV_FILE:-/dev/null}
    environment:
      NODE_ENV: production
      PORT: 3001
      # Both default to DIVO_PUBLIC_URL, so a deployment that sets neither
      # behaves exactly as it always has. They can differ because a deployment
      # can answer to more than one hostname — a real domain and the bare-IP
      # name it was stood up on — and the two names are not interchangeable:
      #
      #   APP_BASE_URL       what people browse. Sessions live in localStorage,
      #                      which is partitioned per origin, so every link Divo
      #                      sends must name the origin its own sign-in uses or
      #                      the recipient lands on a login page.
      #   BACKEND_PUBLIC_URL where OAuth comes back to. This one is registered
      #                      with Google, Lark, Zoho and Shopify, so it can only
      #                      move once those consoles have the new value.
      #
      # Forcing them equal meant adopting a domain required re-registering six
      # integrations on the same day, so the domain never got adopted.
      APP_BASE_URL: ${APP_BASE_URL:-${DIVO_PUBLIC_URL:?DIVO_PUBLIC_URL is required}}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-${DIVO_PUBLIC_URL:?DIVO_PUBLIC_URL is required}}
      REDIS_URL: redis://divo-redis-cache:6379/0
      REDIS_QUEUE_URL: redis://divo-redis-queue:6379/0
      REDIS_CACHE_URL: redis://divo-redis-cache:6379/0
      REDIS_MEMORY_URL: redis://divo-redis-memory:6379/0
      GOOGLE_WORKSPACE_MCP_URL: http://google-workspace-mcp:8000/mcp
      # The Docker socket is isolated in the private controller service; it is
      # never mounted into the public backend container.
      PI_LARK_CONTROLLER_URL: http://divo-pi-controller:4317
      PI_LARK_RUNTIME_INSTANCE_ID: ${PI_LARK_RUNTIME_INSTANCE_ID:-pi-main-1}
      DIVO_AUTONOMOUS_WORKERS_ENABLED: ${DIVO_AUTONOMOUS_WORKERS_ENABLED:-false}
      HINDSIGHT_ENABLED: "true"
      HINDSIGHT_URL: http://divo-hindsight:8888
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:?HINDSIGHT_API_KEY is required}
      KNOWLEDGE_FILE_MALWARE_SCAN_MODE: required
      CLAMAV_HOST: divo-clamav
      CLAMAV_PORT: 3310
      # WhatsApp follow-ups. Both halves of the round trip are container names
      # on divo-main-internal: the gateway is never published to the host, and
      # the webhook never leaves the Docker network on its way back.
      #
      # WHATSAPP_PUBLIC_URL is where the gateway posts; it is "public" only in
      # the sense of "the address Divo answers on from the gateway's side". It
      # is a private name, so it must also appear in divo-openwa's
      # SSRF_ALLOWED_HOSTS or the gateway refuses the webhook at registration.
      #
      # The feature flag and the two shared secrets (OPENWA_API_KEY,
      # WHATSAPP_WEBHOOK_SECRET) come from the env file, not from here.
      OPENWA_URL: http://divo-openwa:2785
      WHATSAPP_PUBLIC_URL: http://divo-backend:3001
      # Not a secret, so it lives here where a reviewer can see it rather than
      # inside an opaque env blob. Overridable from the env file for a fast
      # kill-switch that does not need a code change.
      WHATSAPP_FOLLOWUPS_ENABLED: ${WHATSAPP_FOLLOWUPS_ENABLED:-true}
    depends_on:
      divo-schema-sync:
        condition: service_completed_successfully
      divo-postgres:
        condition: service_healthy
      divo-redis-queue:
        condition: service_healthy
      divo-redis-cache:
        condition: service_healthy
      divo-redis-memory:
        condition: service_healthy
      google-workspace-mcp:
        condition: service_healthy
      divo-hindsight:
        condition: service_healthy
      divo-clamav:
        condition: service_healthy
      divo-pi-controller:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DIVO_BACKEND_PORT:-13002}:3001"
    restart: unless-stopped
    # Media the backend holds while it works on it: Teach recordings and the
    # videos attached to ordinary chats, both of which are gigabyte-scale and
    # short-lived. On a named volume rather than the container's writable layer,
    # because that layer shares a filesystem with Postgres, Redis and every
    # other container on the host — a member uploading recordings faster than
    # they are read would otherwise take the database down with it. Survives a
    # redeploy too, so an upload in flight during one is not silently lost.
    volumes:
      - divo_main_backend_media:/app/.data
    networks:
      - divo-main-internal
      - divo-main-agent-control
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5

  # One release gate synchronizes Prisma's declared schema before app replicas
  # start. This deployment lineage is managed with Prisma db push.
  divo-schema-sync:
    image: ${DIVO_BACKEND_IMAGE:?DIVO_BACKEND_IMAGE is required}
    env_file:
      - ${DIVO_ENV_FILE:-/dev/null}
    command: ["pnpm", "schema:sync"]
    depends_on:
      divo-postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - divo-main-internal
    logging: *default-logging

  divo-hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.8.6
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:${HINDSIGHT_DB_PASSWORD:?HINDSIGHT_DB_PASSWORD is required}@divo-hindsight-postgres:5432/hindsight
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_LLM_PROVIDER:-openai}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:-gpt-4o-mini}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_LLM_API_KEY:?HINDSIGHT_LLM_API_KEY is required}
      HINDSIGHT_API_RERANKER_PROVIDER: rrf
      HINDSIGHT_API_WORKER_ID: divo-production-1
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_API_KEY:?HINDSIGHT_API_KEY is required}
      HINDSIGHT_API_ENABLE_BANK_CONFIG_API: "false"
      HINDSIGHT_API_DEFAULT_BANK_TEMPLATE: '{"version":"1","bank":{"retain_strategies":{"exact":{"retain_extraction_mode":"verbatim","enable_observations":false}}}}'
    depends_on:
      divo-hindsight-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - divo-main-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 8

  divo-clamav:
    image: clamav/clamav:1.5.3
    volumes:
      - divo_main_clamav_signatures:/var/lib/clamav
    restart: unless-stopped
    networks:
      - divo-main-internal
    logging: *default-logging

  divo-hindsight-postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: hindsight
      POSTGRES_USER: hindsight
      POSTGRES_PASSWORD: ${HINDSIGHT_DB_PASSWORD:?HINDSIGHT_DB_PASSWORD is required}
    volumes:
      - divo_main_hindsight_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - divo-main-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hindsight -d hindsight"]
      interval: 10s
      timeout: 5s
      retries: 8

  divo-pi-controller:
    image: ${DIVO_PI_CONTROLLER_IMAGE:?DIVO_PI_CONTROLLER_IMAGE is required}
    user: "0:0"
    environment:
      DIVO_CONTROLLER_HOST: 0.0.0.0
      DIVO_CONTROLLER_PORT: 4317
      DIVO_PI_IMAGE: ${DIVO_PI_IMAGE:?DIVO_PI_IMAGE is required}
      DIVO_PI_RESOURCE_PREFIX: divo-pi-main
      DIVO_PI_ADD_HOST_GATEWAY: "false"
      # Retrieved tool surface. Production ran the eager fallback for the whole
      # rollout because this defaulted off and nothing set it: 54 tools and
      # ~105KB of schemas on every model call, re-sent on every step of an
      # agent loop. Dev has defaulted on since the surface landed.
      DIVO_DEEPSEEK_TOOL_SURFACE: ${DIVO_DEEPSEEK_TOOL_SURFACE:-on}
      HOME: /tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - divo-main-agent-control
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4317/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  google-workspace-mcp:
    image: ghcr.io/taylorwilsdon/google_workspace_mcp:1.22.2
    env_file:
      - ${DIVO_ENV_FILE:-/dev/null}
    environment:
      MCP_ENABLE_OAUTH21: "true"
      EXTERNAL_OAUTH21_PROVIDER: "true"
      WORKSPACE_MCP_STATELESS_MODE: "true"
      WORKSPACE_MCP_TOOL_TIER: complete
      WORKSPACE_MCP_TOOLS: gmail,drive,calendar,docs,sheets,slides,forms,tasks,contacts,chat,appscript
      TOOL_TIER: complete
      TOOLS: gmail drive calendar docs sheets slides forms tasks contacts chat appscript
      ALLOWED_FILE_DIRS: /tmp/divo-no-local-files
    restart: unless-stopped
    networks:
      - divo-main-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  # WhatsApp gateway for Urban Aura's follow-ups: a pinned upstream image, run
  # the same way as every other third-party service in this file.
  #
  # Deliberately unpublished — note the absence of `ports:`. This container
  # holds the pairing credentials for a real company handset, and Divo's own
  # follow-ups UI is the only place a session is created, paired or logged out.
  # Publishing the gateway's bundled dashboard, even on 127.0.0.1, would stand
  # up a second console over the same sessions with its own login and its own
  # idea of who may unlink a phone. One authority; reached over the internal
  # network only.
  divo-openwa:
    image: ghcr.io/rmyndharis/openwa:0.23.3
    environment:
      # Everything the image already sets correctly is left to the image:
      # NODE_ENV, the 2785 default port, and HOME=/app/data. Upstream's compose
      # overrides HOME to the tmpfs, but that is a Chromium workaround — under
      # Baileys it would only move state off the volume onto a disk that empties
      # on restart.
      LOG_LEVEL: ${OPENWA_LOG_LEVEL:-info}
      # Browser-free engine. The gateway defaults to whatsapp-web.js, which runs
      # a full Chromium per session; this host has two cores and already carries
      # eleven containers. Every capability Divo's client actually calls —
      # pairing, QR, pairing code, sends, chat history, number checks, webhooks,
      # logout — is supported on Baileys by the gateway's own engine capability
      # matrix, so the browser buys nothing here. Pinned rather than left to the
      # dashboard's default, because the default is the expensive one.
      ENGINE_TYPE: baileys
      # Shared with the backend's OPENWA_API_KEY. Required, not defaulted: a
      # gateway with no master key is one that anything on the network can drive.
      API_MASTER_KEY: ${OPENWA_API_KEY:?OPENWA_API_KEY is required — the WhatsApp gateway will not run unauthenticated}
      # The gateway refuses to register a webhook aimed at a private address
      # unless the host is named here, and it refuses at registration time
      # rather than at the first message — so the failure would look like
      # "pairing worked, nothing ever arrives". divo-backend is a container name
      # on divo-main-internal, hence private, hence listed.
      SSRF_ALLOWED_HOSTS: divo-backend
      # Re-adopt already-paired sessions after a restart, so a redeploy does not
      # need somebody standing by with the handset to re-scan a QR.
      AUTO_START_SESSIONS: "true"
      # Session ownership is leased per node, and the gateway's default node id
      # is the container hostname — which Docker regenerates on every recreate.
      # Left alone, each deploy would present as a brand-new node to the
      # outgoing one's lease and sit out its TTL before touching the session,
      # so follow-ups would go quiet for minutes after every release. Pinned.
      NODE_ID: ${OPENWA_NODE_ID:-divo-main-openwa-1}
      ENABLE_SWAGGER: "false"
    volumes:
      - divo_main_openwa_data:/app/data
    restart: unless-stopped
    networks:
      - divo-main-internal
    # Upstream's own hardening, carried over: the container is the confinement
    # boundary. Capabilities drop to the five the entrypoint needs to chown the
    # data volume and gosu down from root; once it drops, the Node process holds
    # none of them.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
    # A fork-bomb ceiling, not an allocation — the kernel only refuses forks
    # once the count is reached, so the headroom is free on a single-process
    # engine.
    pids_limit: 2048
    mem_limit: ${OPENWA_MEM_LIMIT:-2g}
    # The graceful drain plus per-engine teardown can outrun Docker's 10s
    # default, which would kill the engine mid-teardown and orphan the session.
    stop_grace_period: 45s
    logging: *default-logging
    # Upstream's readiness probe, plus the error handler it omits: without one a
    # refused connection never calls back, so a gateway that is down reads as a
    # probe that hangs to its timeout instead of a probe that failed.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:2785/api/health/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  divo-admin:
    image: ${DIVO_ADMIN_IMAGE:?DIVO_ADMIN_IMAGE is required}
    environment:
      # Pass only the browser-safe key; never expose the backend's env file to nginx.
      LOGO_DEV_PUBLISHABLE_KEY: ${LOGO_DEV_PUBLISHABLE_KEY:-}
    depends_on:
      divo-backend:
        condition: service_started
    ports:
      - "127.0.0.1:${DIVO_ADMIN_PORT:-18082}:80"
    restart: unless-stopped
    networks:
      - divo-main-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  divo-redis-queue:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - divo_main_redis_queue_data:/data
    restart: unless-stopped
    networks:
      - divo-main-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  divo-redis-cache:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "300", "10"]
    volumes:
      - divo_main_redis_cache_data:/data
    restart: unless-stopped
    networks:
      - divo-main-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  divo-redis-memory:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "300", "10"]
    volumes:
      - divo_main_redis_memory_data:/data
    restart: unless-stopped
    networks:
      - divo-main-internal
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  divo-main-internal:
    driver: bridge
  divo-main-agent-control:
    driver: bridge

volumes:
  divo_main_backend_media:
  divo_main_postgres_data:
  divo_main_redis_queue_data:
  divo_main_redis_cache_data:
  divo_main_redis_memory_data:
  divo_main_hindsight_postgres_data:
  divo_main_clamav_signatures:
  divo_main_openwa_data:
